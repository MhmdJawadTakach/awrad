<script>
/* ===== Saving my data in the installed app =====
   Two ways, my choice in Settings:
   - "device": every tick is written on this device at once; a reminder and a one-tap backup, and on laptops an
     automatic file I pick once (inside a Drive / iCloud folder if I like) kept up to date after each change and on close.
   - "drive": the app keeps one file in its own hidden folder of my Google Drive and merges it with every device.
   Merging is per cell: each tick, bedtime, log entry, the Quran counter and my settings carry the time they last
   changed, so an untick on one device is not undone by another. */
(function () {
  'use strict';
  var CLIENT_ID = window.GOOGLE_CLIENT_ID || '';
  var SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  var FILE_NAME = 'awrad-sync.json';
  var K = { mode: 'awrad:saveMode', last: 'awrad:lastBackup', meta: 'awrad:meta', drive: 'awrad:drive', remind: 'awrad:remind',
    authState: 'awrad:authState', authErr: 'awrad:authErr', dirty: 'awrad:dirty', first: 'awrad:firstData', fileAt: 'awrad:fileAt' };
  var DAY = 864e5, REMIND_DAYS = 7;
  var APP_URL = location.origin + location.pathname.replace(/index\.html$/, '');
  var WEEK_RE = /^tracker:(\d{4}-\d{2}-\d{2})$/;

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function jget(k, d) { try { var v = JSON.parse(get(k)); return v == null ? d : v; } catch (e) { return d; } }
  function now() { return Date.now(); }
  function EN() { return document.documentElement.lang === 'en'; }
  function T(ar, en) { return EN() ? en : ar; }

  /* ---------- OAuth: Google sends me back here with the token in the address; take it before the app starts ---------- */
  (function takeToken() {
    var h = location.hash; if (!h || h.length < 2) return;
    var p = {}; h.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
    if (!p.state || (!p.access_token && !p.error)) return;
    var want = get(K.authState); del(K.authState);
    history.replaceState(null, '', location.pathname + location.search);
    if (!want || want !== p.state) return;
    if (p.access_token) {
      var d = jget(K.drive, {}); d.token = p.access_token; d.exp = now() + (Math.max(120, +p.expires_in || 3600) - 60) * 1000; d.linked = true; d.authOk = now();
      set(K.drive, JSON.stringify(d)); del(K.authErr); set(K.mode, 'drive');
    } else { set(K.authErr, p.error); }
  })();

  /* ---------- change tracking: when did each piece of my data last change on this device ---------- */
  var meta = jget(K.meta, {});
  function normMeta() { meta.cells = meta.cells || {}; meta.logs = meta.logs || {}; meta.tomb = meta.tomb || {}; meta.quran = meta.quran || 0; meta.config = meta.config || 0; }
  normMeta();
  function saveMeta() { set(K.meta, JSON.stringify(meta)); }
  function parse(s) { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  var dirty = get(K.dirty) === '1';
  function setDirty(v) { dirty = v; if (v) set(K.dirty, '1'); else del(K.dirty); }

  function changed(k, oldS, newS) {
    var t = now(), m;
    if ((m = WEEK_RE.exec(k))) {
      var wk = m[1], a = parse(oldS) || {}, b = parse(newS) || {}, c = meta.cells[wk] || (meta.cells[wk] = {});
      Object.keys(a).concat(Object.keys(b)).forEach(function (cell) { if (!same(a[cell], b[cell])) c[cell] = t; });
    } else if (k === 'tracker:logs') {
      var la = parse(oldS) || {}, lb = parse(newS) || {};
      Object.keys(lb).forEach(function (id) { if (!same(la[id], lb[id])) { meta.logs[id] = t; delete meta.tomb[id]; } });
      Object.keys(la).forEach(function (id) { if (!(id in lb)) { meta.tomb[id] = t; delete meta.logs[id]; } });
    } else if (k === 'tracker:quran') { meta.quran = t; }
    else if (k === 'tracker:config') { meta.config = t; }
    else return;
    saveMeta(); setDirty(true); schedule(); paint();
  }

  /* ---------- a full picture of my data, straight from this device (also a valid backup file) ---------- */
  function snapshot() {
    var weeks = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i), m = WEEK_RE.exec(k); if (m) weeks[m[1]] = parse(localStorage.getItem(k)) || {}; } } catch (e) {}

      logs: parse(get('tracker:logs')) || {}, quran: parse(get('tracker:quran')), config: parse(get('tracker:config')), sync: meta };
  }
  function core(s) { return JSON.stringify({ w: s.weeks || {}, l: s.logs || {}, q: s.quran || null, c: s.config || null }); }
  function hasData(s) { return Object.keys(s.weeks).some(function (w) { return Object.keys(s.weeks[w]).length; }) || Object.keys(s.logs).length || !!(s.quran && (s.quran.page || s.quran.khatmas)); }

  /* ---------- merging two pictures (this device + Drive): the newer change wins, piece by piece ---------- */
  function merge(L, R) {
    var lm = L.sync || {}, rm = R.sync || {};
    ['cells', 'logs', 'tomb'].forEach(function (x) { lm[x] = lm[x] || {}; rm[x] = rm[x] || {}; });
    var LW = L.weeks || {}, RW = R.weeks || {}, LL = L.logs || {}, RL = R.logs || {};
    var out = { weeks: {}, logs: {}, quran: null, config: null, sync: { cells: {}, logs: {}, tomb: {}, quran: 0, config: 0 } };
    var wks = {}; [LW, RW, lm.cells, rm.cells].forEach(function (o) { Object.keys(o).forEach(function (w) { wks[w] = 1; }); });
    Object.keys(wks).forEach(function (wk) {
      var a = LW[wk] || {}, b = RW[wk] || {}, ta = lm.cells[wk] || {}, tb = rm.cells[wk] || {}, res = {}, ts = {}, cells = {};
      [a, b, ta, tb].forEach(function (o) { Object.keys(o).forEach(function (c) { cells[c] = 1; }); });
      Object.keys(cells).forEach(function (c) {
        var x = ta[c] || 0, y = tb[c] || 0, v;
        if (!x && !y) v = c in a ? a[c] : b[c];          // older data with no times on either side: keep whatever exists
        else v = x >= y ? a[c] : b[c];
        if (v !== undefined && v !== null && v !== false && v !== '') res[c] = v;
        if (x || y) ts[c] = Math.max(x, y);
      });
      if (Object.keys(res).length || LW[wk] || RW[wk]) out.weeks[wk] = res;
      if (Object.keys(ts).length) out.sync.cells[wk] = ts;
    });
    var ids = {}; [LL, RL, lm.logs, rm.logs, lm.tomb, rm.tomb].forEach(function (o) { Object.keys(o).forEach(function (id) { ids[id] = 1; }); });
    Object.keys(ids).forEach(function (id) {
      var la = LL[id], ra = RL[id];
      var lt = la ? (lm.logs[id] || 0) : (lm.tomb[id] || 0), rt = ra ? (rm.logs[id] || 0) : (rm.tomb[id] || 0);
      var t = Math.max(lt, rt), win = lt === rt ? (la || ra) : lt > rt ? la : ra;
      if (win) { out.logs[id] = win; if (t) out.sync.logs[id] = t; } else if (t) out.sync.tomb[id] = t;
    });
    var lq = lm.quran || 0, rq = rm.quran || 0;
    if (L.quran && R.quran) out.quran = lq > rq ? L.quran : rq > lq ? R.quran : ((+R.quran.rev || 0) > (+L.quran.rev || 0) ? R.quran : L.quran);
    else out.quran = L.quran || R.quran || null;
    out.sync.quran = Math.max(lq, rq);
    var lc = lm.config || 0, rc = rm.config || 0;
    out.config = L.config && R.config ? (rc > lc ? R.config : L.config) : (L.config || R.config || null);
    out.sync.config = Math.max(lc, rc);
    return out;
  }
  // write a merged picture onto this device, then let the app read it again
  function apply(M) {
    var before = core(snapshot());
    try {
      Object.keys(M.weeks).forEach(function (wk) { var v = JSON.stringify(M.weeks[wk]); if (get('tracker:' + wk) !== v) localStorage.setItem('tracker:' + wk, v); });
      localStorage.setItem('tracker:logs', JSON.stringify(M.logs));
      if (M.quran) localStorage.setItem('tracker:quran', JSON.stringify(M.quran));
      if (M.config) localStorage.setItem('tracker:config', JSON.stringify(M.config));
    } catch (e) { return false; }
    meta = M.sync; normMeta(); saveMeta();
    var moved = before !== core(snapshot());
    if (moved && window.TRACKER) window.TRACKER.reload();
    return moved;
  }

  /* ---------- state ---------- */
  var timer = null, busy = false, lastErr = '', fileState = 'none', fileName = '', fileAt = +get(K.fileAt) || 0;
  // when Google answers «too many requests» or is down for a moment: wait (as Google asks, or 30 s, 1 min, 2 min … up to 15 min) and try again by myself
  var retryN = 0, retryAt = 0, retryTimer = null;
  // signed in to my account (and my data key open on this device): the account is where my data syncs
  function acct() { return window.AWRAD_ACCOUNT && window.AWRAD_ACCOUNT.active() ? window.AWRAD_ACCOUNT : null; }
  function mode() { return acct() ? 'account' : get(K.mode) === 'drive' ? 'drive' : 'device'; }
  function drive() { return jget(K.drive, {}); }
  function setDrive(d) { set(K.drive, JSON.stringify(d)); }
  function lastBackup() { return +get(K.last) || 0; }
  function remindOn() { return get(K.remind) !== '0'; }

    else if (dirty || now() - (drive().lastSync || 0) > 30 * 60000) renewQuietly();

  window.addEventListener('pagehide', onHide);
  window.addEventListener('online', function () { paint(); if (mode() === 'drive' || mode() === 'account') sync(false); });

  function start() {
    mountButton();
    var err = get(K.authErr);

      del(K.authErr); lastErr = 'auth';
      if (err !== 'access_denied' && err !== 'interaction_required' && err !== 'login_required' && err !== 'consent_required')
        toast(T('لم يكتمل تسجيل الدخول إلى Google، أضغط زرّ الحفظ لأحاول مرة أخرى.', 'Google sign-in did not finish; tap the save button to try again.'));

  /* ---------- Settings: "Saving my data", above My data ---------- */

  function settings(ui) {
    if (window.AWRAD_ACCOUNT) { try { var ac = window.AWRAD_ACCOUNT.card(ui); if (ac) ui.root.insertBefore(ac, ui.root.firstChild); } catch (e) {} }
    var c = ui.card(T('بياناتي', 'My data'), 'scroll'); c.setAttribute('data-card', 'mydata'); ui.root.insertBefore(c, ui.before);
    var intro = document.createElement('div'); intro.className = 'insight';
    var is = document.createElement('span'); is.textContent = T('أختار كيف تُحفظ بياناتي. في الحالتين يُحفظ كل تأشير على جهازي فوراً، ولا يضيع شيء حين أغلق النافذة.', 'I choose how my data is saved. Either way, every tick is saved on this device at once, and nothing is lost when I close the window.');
    intro.appendChild(is); c.appendChild(intro);
    var rm = ui.srow(T('طريقة الحفظ', 'How I save'), '');
    var seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', T('طريقة الحفظ', 'How I save'));
    [['device', T('على جهازي', 'On this device'), IC.device], ['drive', 'Google Drive', IC.cloud]].forEach(function (x) {
      var b = document.createElement('button'); b.type = 'button'; b.innerHTML = x[2]; b.appendChild(document.createTextNode(x[1]));
      b.setAttribute('aria-pressed', mode() === x[0] ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (mode() === x[0]) return;

        body(); paint();
        if (x[0] === 'drive' && drive().linked) { if (tokenOk()) sync(false); }
      });
      seg.appendChild(b);
    });
    rm.appendChild(seg); c.appendChild(rm);
    var inAcct = mode() === 'account'; if (inAcct) rm.hidden = true;
    var box = document.createElement('div'); c.appendChild(box);
    var live = document.createElement('div'); live.className = 'smsg savestate'; live.id = 'saveLive'; live.setAttribute('role', 'status'); c.appendChild(live);
    function row(title, desc) { var r = ui.srow(title, desc); box.appendChild(r); return r; }
    function body() {
      box.textContent = '';
      if (mode() === 'account') {
        var ra = row(T('حسابي', 'My account'), T('بياناتي مشفّرة على جهازي ومتزامنة مع حسابي بين أجهزتي. أدير الحساب من «حسابي» في أعلى الإعدادات.', 'My data is encrypted on my device and synced with my account across my devices. I manage the account in “My account” at the top of Settings.'));
        var rb = row(T('نسخة احتياطية', 'Backup'), T('ملف كامل أحتفظ به بنفسي، إضافة إلى حسابي.', 'A full file I keep myself, besides my account.'));
        rb.appendChild(ui.btn(T('احفظ نسخة الآن', 'Back up now'), 'ghost', ui.IC_DOWN, function () { backupNow(); }));

            br.appendChild(ui.btn(T('إيقاف', 'Stop'), 'ghost', '', unlinkFile));
            r2.appendChild(br);
          } else {
            var r2b = row(T('ملف الحفظ التلقائي', 'Automatic file'), T('أختار ملفاً مرة واحدة، ويُفضَّل أن يكون في مجلد Google Drive أو iCloud على جهازي، فيحدّثه التطبيق بنفسه بعد كل تغيير وقبل إغلاق النافذة.', 'I choose a file once, ideally inside a Google Drive or iCloud folder on this computer, and the app keeps it up to date after every change and before the window closes.'));
            r2b.appendChild(ui.btn(T('اختيار ملف', 'Choose a file'), 'ghost', '', pickFile));
          }
        }
        var r3 = row(T('التذكير', 'Reminder'), T('يذكّرني التطبيق إن مرّ أسبوع دون نسخة احتياطية.', 'The app reminds me when a week passes without a backup.'));

        } else {
          var r5 = row('Google Drive', T('بياناتي في مجلد خاص بالتطبيق داخل Drive، وتتزامن تلقائياً حين أفتح التطبيق وبعد كل تغيير. وأستطيع إلغاء الإذن في أي وقت من حسابي في Google.', 'My data is in a private app folder in my Drive and syncs by itself when I open the app and after every change. I can remove the permission at any time from my Google account.'));
          var br2 = document.createElement('div'); br2.className = 'btnrow';
          br2.appendChild(ui.btn(T('زامن الآن', 'Sync now'), 'primary', '', saveNow));
          br2.appendChild(ui.btn(T('فصل الحساب', 'Unlink'), 'ghost', '', unlinkDrive));
          r5.appendChild(br2);
        }
      }
      paint();
    }
    refreshFn = function () { if (document.body.contains(box)) body(); };
    body();
    // the Excel tables and the restore join this card, under how my data is saved
    var old = ui.before;
    if (old && old.parentNode && old !== c) {
      var oh = old.querySelector('h2');
      Array.prototype.slice.call(old.childNodes).forEach(function (n) { if (n !== oh) c.appendChild(n); });
      old.parentNode.removeChild(old);
    }
  }

  window.TRACKER_HOOKS = {
    changed: changed, settings: settings,
    ready: function () { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else setTimeout(start, 0); }
  };

})();

<body>
<title>أوراد - البرنامج الشخصي اليومي</title>
<style>

/* Layout: one narrow RTL column — colored band with palette + tabs, then either the tick list or the progress report */
:root {

}

    --good: #6CC495; --good-bg: #1C2E24; --warn: #F08A80; --warn-bg: #36201E; --flat: #D9C37E; --flat-bg: #2C281A; color-scheme: dark }
  :root[data-palette="navy"]:not([data-theme="light"]) { --bg: #10141B; --surface: #181E28; --line: #2A3342; --chip: #212937; --band: #16233A; --check: #7FA6D6; }
  :root[data-palette="burgundy"]:not([data-theme="light"]) { --bg: #171212; --surface: #211919; --line: #3A2C2B; --chip: #2B2121; --band: #4A2222; --check: #D69A93; }
}
:root[data-theme="dark"] { --bg: #121614; --surface: #1A201D; --ink: #ECE9E0; --muted: #A4A79C; --line: #2C3531; --chip: #222A26;
  --band: #183129; --band-ink: #F1ECDD; --gold: #D9B868; --gold-ink: #E6C77F; --check: #5FA88A; --check-ink: #0F1512;
  --good: #6CC495; --good-bg: #1C2E24; --warn: #F08A80; --warn-bg: #36201E; --flat: #D9C37E; --flat-bg: #2C281A; color-scheme: dark }
:root[data-theme="dark"][data-palette="navy"] { --bg: #10141B; --surface: #181E28; --line: #2A3342; --chip: #212937; --band: #16233A; --check: #7FA6D6; }
:root[data-theme="dark"][data-palette="burgundy"] { --bg: #171212; --surface: #211919; --line: #3A2C2B; --chip: #2B2121; --band: #4A2222; --check: #D69A93; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }

.si { display: inline-flex; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* progress */
.alert { border-radius: 14px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; border: 1px solid transparent; }

.alert.flat { background: var(--flat-bg); border-color: var(--flat); } .alert.flat svg, .alert.flat h3 { color: var(--flat); }

.up { color: var(--good); } .down { color: var(--warn); } .same { color: var(--muted); }
.chart { padding: 12px 12px 8px; }

.chart .bar { fill: var(--check); }
.chart .bar.cur { fill: var(--gold); }
.chart .val { fill: var(--ink); font-weight: 600; }
.note { font-size: 12px; color: var(--muted); padding: 0 16px 12px; }
.cmp { padding: 8px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.cmprow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }

.cmprow .dl { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bars { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }
.bl { display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }

.legend span { display: inline-flex; align-items: center; gap: 6px; }

@media (max-width: 400px) { .sleepin { padding-inline: 5px; gap: 2px; } .sleepin svg { display: none; } .sleepin input { width: 44px; } .strip { grid-template-columns: repeat(7, 6px); gap: 4px; } .strip i { width: 6px; height: 6px; } .rowwrap { gap: 6px; } .sleepkpis .v { font-size: 18px; } }

@media (prefers-reduced-motion: reduce) { .box { transition: none; } }

/* ---------- phones (iPhone and Android): app-style bottom tab bar ---------- */

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--band); gap: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    border-top: 1px solid color-mix(in srgb, var(--gold-soft) 40%, transparent); box-shadow: 0 -6px 20px rgba(0,0,0,.18); }

  body { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }

@media (min-width: 1024px) {
  .wrap { max-width: 1240px; }

}

/* ---------- settings ---------- */

.irow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); }

/* ---------- app lock: the page blurs behind a keypad, and the blur melts away when the code is right ---------- */
.lockscreen { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow-y: auto;
  padding: max(24px, env(safe-area-inset-top, 0px)) 20px max(24px, env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--band) 80%, transparent);
  -webkit-backdrop-filter: blur(26px) saturate(1.3); backdrop-filter: blur(26px) saturate(1.3);
  transition: opacity .6s ease, -webkit-backdrop-filter .6s ease, backdrop-filter .6s ease; }
.lockscreen.entering, .lockscreen.leaving { opacity: 0; -webkit-backdrop-filter: blur(0px) saturate(1); backdrop-filter: blur(0px) saturate(1); }
.lockscreen.leaving { pointer-events: none; }
/* while locked, the page behind stays visible so the frosted glass shows through, but it is sealed off: it takes no tap, key or focus (inert + the capture-phase guard), it cannot scroll, and the blur leaves it unreadable */
html.is-locked, html.is-locked body { overflow: hidden !important; }
html.is-locked body > *:not(.lockscreen):not(script):not(style):not(link):not(title) { pointer-events: none !important; }
/* a browser too old to frost the page behind the glass hides it outright instead, so nothing shows through sharp */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html.is-locked body > *:not(.lockscreen):not(script):not(style):not(link):not(title) { visibility: hidden !important; }
}
.lockscreen .lpat { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .2; pointer-events: none; }
.lockcard { position: relative; width: min(330px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; color: #F6F3EA; text-align: center; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.lockscreen.entering .lockcard { transform: translateY(14px) scale(.97); }
.lockscreen.leaving .lockcard { transform: scale(1.05); }
.lockmark { width: 66px; height: 66px; display: grid; place-items: center; margin-bottom: 2px; }
.lockmark span { width: 46px; height: 46px; display: grid; place-items: center; border: 1.5px solid var(--gold-soft); border-radius: 11px; transform: rotate(45deg); background: rgba(212,178,106,.12); box-shadow: 0 0 0 7px rgba(212,178,106,.08); }
.lockmark svg { width: 22px; height: 22px; color: var(--gold-soft); transform: rotate(-45deg); }
.lockname { font-size: 27px; font-weight: 700; line-height: 1.2; }
.lockdate { font-size: 13px; color: rgba(246,243,234,.78); margin-top: -8px; }
.lockhint { min-height: 24px; font-size: 15px; font-weight: 600; color: rgba(246,243,234,.94); margin-top: 6px; }
.lockhint.warn { color: #F8CBC5; }
.lockdots { display: flex; gap: 22px; direction: ltr; margin: 2px 0 12px; }
.lockdots i { width: 13px; height: 13px; border: 1.6px solid var(--gold-soft); border-radius: 3px; transform: rotate(45deg); transition: background-color .15s, box-shadow .3s; }
.lockdots i.on { background: var(--gold-soft); }
.lockdots i.pop { animation: ldpop .3s cubic-bezier(.3,1.6,.5,1); }
.lockdots.err { animation: lshake .45s ease; }
.lockdots.err i { border-color: #F2A39A; background: #F2A39A; }
.lockdots.ok i { background: var(--gold-soft); box-shadow: 0 0 16px rgba(212,178,106,.95); }
.lockpad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px 24px; direction: ltr; }
.lockpad button { width: 74px; height: 74px; border-radius: 50%; border: 1px solid rgba(212,178,106,.4); background: rgba(255,255,255,.08); color: #F6F3EA; font: 500 28px/1 var(--font); display: grid; place-items: center; cursor: pointer; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background-color .15s, transform .1s, border-color .15s; }
.lockpad button:hover { background: rgba(255,255,255,.13); }
.lockpad button:active, .lockpad button.hit { background: rgba(212,178,106,.34); border-color: var(--gold-soft); transform: scale(.93); }
.lockcard:focus { outline: none; }
.lockpad button:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 3px; }
.lockpad button:disabled { opacity: .35; cursor: default; transform: none; }
.lockpad .lk-ghost { border-color: transparent; background: transparent; font-size: 15px; font-weight: 600; }
.lockpad .lk-ghost svg { width: 27px; height: 27px; }
.lockpad .lk-empty { visibility: hidden; }
.lockfoot { margin-top: 4px; background: none; border: 0; color: #F2DDA4; font: 600 14px var(--font); cursor: pointer; min-height: 44px; padding: 0 14px; }
.lockfoot:focus-visible { outline: 2px solid var(--gold-soft); border-radius: 8px; }
.lockcard.forgot .lockpad, .lockcard.forgot .lockdots, .lockcard.forgot .lockfoot, .lockcard.forgot .lockhint { display: none; }
.lockforgot { background: rgba(0,0,0,.24); border: 1px solid rgba(212,178,106,.38); border-radius: 16px; padding: 16px; font-size: 14px; line-height: 1.8; display: flex; flex-direction: column; gap: 12px; }
.lockforgot p { margin: 0; }
.lockforgot-row { display: flex; flex-direction: column; gap: 8px; }
.lockbtn-danger, .lockbtn-quiet { min-height: 46px; border-radius: 12px; font: 700 15px var(--font); cursor: pointer; padding: 0 14px; }
.lockbtn-danger { background: #B3261E; color: #FFFFFF; border: 0; }
.lockbtn-quiet { background: transparent; color: #F6F3EA; border: 1px solid rgba(246,243,234,.4); }
.lockbtn-danger:focus-visible, .lockbtn-quiet:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 2px; }
@keyframes ldpop { 0% { transform: rotate(45deg) scale(.5); } 60% { transform: rotate(45deg) scale(1.35); } 100% { transform: rotate(45deg) scale(1); } }
@keyframes lshake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@media (max-height: 680px) { .lockpad { grid-template-columns: repeat(3, 62px); gap: 10px 22px; } .lockpad button { width: 62px; height: 62px; font-size: 24px; } .lockcard { gap: 10px; } .lockmark { display: none; } }
@media (prefers-reduced-motion: reduce) { .lockscreen, .lockcard, .lockpad button { transition: none; } .lockdots i.pop, .lockdots.err { animation: none; } }
/* the lock button: beside Settings on wider screens, at the end of the bottom bar on phones */
.locktab { display: none; }
@media (max-width: 640px) { .gear.lockbtn { display: none; } .tab.locktab { display: flex; flex: 0 0 64px; } }

توقف", "أختار ملفاً مرة واحدة، ويُفضَّل أن يكون في مجلد Google Drive أو iCloud على جهازي، فيحدّثه التطبيق بنفسه بعد كل تغيير وقبل إغلاق النافذة.": "یک بار پرونده‌ای انتخاب می‌کنم، ترجیحاً در پوشه‌ی Google Drive یا iCloud روی دستگاهم، و برنامه پس از هر تغییر و پیش از بستن پنجره خودش آن را به‌روز می‌کند.", "اختيار ملف": "انتخاب پرونده", "التذكير": "یادآوری", "يذكّرني التطبيق إن مرّ أسبوع دون نسخة احتياطية.": "اگر یک هفته بدون نسخه‌ی پشتیبان بگذرد، برنامه یادآوری‌ام می‌کند.", "التذكير بالنسخة الاحتياطية": "یادآوری نسخه‌ی پشتیبان", "لم يُفعَّل الربط في هذه النسخة بعد: يحتاج التطبيق مفتاح Google الخاص به. إلى أن يُفعَّل تبقى بياناتي محفوظة على جهازي.": "اتصال در این نسخه هنوز فعال نشده است: برنامه به کلید Google مخصوص خودش نیاز دارد. تا آن موقع داده‌هایم روی دستگاهم ذخیره می‌ماند.", "ربط Google Drive": "اتصال به Google Drive", "أسجّل الدخول بحسابي في Google مرة واحدة على كل جهاز، فتُحفظ بياناتي في مجلد خاص بالتطبيق داخل Drive لا يراه غيره، وتتزامن بين أجهزتي تلقائياً.": "روی هر دستگاه یک بار با حساب Google وارد می‌شوم تا داده‌هایم در پوشه‌ای مخصوص برنامه در Drive ذخیره شود که جز آن دیده نمی‌شود، و خودکار میان دستگاه‌هایم همگام شود.", "أحتاج الإنترنت لأربط حسابي.": "برای اتصال حسابم به اینترنت نیاز دارم.", "بياناتي في مجلد خاص بالتطبيق داخل Drive، وتتزامن تلقائياً حين أفتح التطبيق وبعد كل تغيير. وأستطيع إلغاء الإذن في أي وقت من حسابي في Google.": "داده‌هایم در پوشه‌ای مخصوص برنامه در Drive است و هنگام باز کردن برنامه و پس از هر تغییر خودکار همگام می‌شود. هر وقت بخواهم می‌توانم این اجازه را از حساب Google خود لغو کنم.", "زامن الآن": "همین حالا همگام کن", "فصل الحساب": "قطع اتصال حساب", "ربط Google Drive لم يُفعَّل بعد": "اتصال به Google Drive هنوز فعال نشده", "لم أربط Google Drive بعد": "هنوز Google Drive را وصل نکرده‌ام", "أزامن بياناتي الآن…": "در حال همگام‌سازی داده‌هایم…", "دون إنترنت: أزامن حين أتّصل": "بدون اینترنت: وقتی وصل شوم همگام می‌کنم", "Google Drive مشغول الآن، أعيد المحاولة بعد قليل. بياناتي محفوظة على جهازي.": "Google Drive الان شلوغ است؛ کمی بعد دوباره امتحان می‌کنم. داده‌هایم روی همین دستگاه امن است.", "Google Drive مشغول الآن، سأعيد المحاولة وحدي.": "Google Drive الان شلوغ است؛ خودم دوباره امتحان می‌کنم.", "تعذّرت المزامنة، أضغط لأحاول مرة أخرى": "همگام‌سازی نشد؛ می‌زنم تا دوباره امتحان کنم", "أضغط لأكمل المزامنة مع Drive": "می‌زنم تا همگام‌سازی با Drive کامل شود", "متزامنة مع Drive": "همگام با Drive", "أضغط لأتابع الحفظ في ملفي": "می‌زنم تا ذخیره در پرونده‌ام ادامه یابد", "لم آخذ نسخة احتياطية بعد": "هنوز نسخه‌ی پشتیبان نگرفته‌ام", "محفوظة على جهازي": "ذخیره روی دستگاهم", "لم آخذ نسخة احتياطية من بياناتي بعد.": "هنوز از داده‌هایم نسخه‌ی پشتیبان نگرفته‌ام.", "أنا في التجربة الآن، ولا يُحفظ منها شيء.": "اکنون در حالت آزمایشم و چیزی از آن ذخیره نمی‌شود.", "ربط Google Drive لم يُفعَّل بعد في هذا التطبيق.": "اتصال به Google Drive هنوز در این برنامه فعال نشده است.", "لا إنترنت الآن، أزامن حين أتّصل.": "اکنون اینترنت نیست؛ وقتی وصل شوم همگام می‌کنم.", "بياناتي متزامنة مع Drive.": "داده‌هایم با Drive همگام است.", "زامنت بياناتي مع Drive.": "داده‌هایم را با Drive همگام کردم.", "حفظت بياناتي في ملفي.": "داده‌هایم را در پرونده‌ام ذخیره کردم.", "أخذت نسخة احتياطية من بياناتي.": "از داده‌هایم نسخه‌ی پشتیبان گرفتم.", "تعذّر حفظ النسخة، أحاول مرة أخرى.": "نسخه ذخیره نشد؛ دوباره امتحان می‌کنم.", "سأحفظ بياناتي في هذا الملف تلقائياً.": "داده‌هایم را خودکار در این پرونده ذخیره می‌کنم.", "تعذّر اختيار الملف.": "انتخاب پرونده ممکن نشد.", "تعذّرت المزامنة الآن، أحاول لاحقاً.": "اکنون همگام‌سازی نشد؛ بعداً امتحان می‌کنم.", "لم يكتمل تسجيل الدخول إلى Google، أضغط زرّ الحفظ لأحاول مرة أخرى.": "ورود به Google کامل نشد؛ دکمه‌ی ذخیره را می‌زنم تا دوباره امتحان کنم.", "كل تأشير يُحفظ فوراً حتى لو أغلقت النافذة مباشرة بعده.": "هر علامت فوراً ذخیره می‌شود، حتی اگر بلافاصله پس از آن پنجره را ببندم.", "القفل برمز سرّي: رمز من أربعة أرقام يُطلب عند فتح التطبيق، وكل ما خلفه ضبابي حتى يُفتح. أغيّره أو أوقفه من الإعدادات، وأقفل يدوياً من زرّ القفل، وأختار القفل التلقائي فور مغادرتي أو بعد مدة.": "قفل با رمز: رمزی چهاررقمی که هنگام باز کردن برنامه پرسیده می‌شود و همه چیز پشت آن تا باز شدن مه‌آلود است. از تنظیمات تغییرش می‌دهم یا خاموشش می‌کنم، با دکمه‌ی قفل دستی قفل می‌کنم، و قفل خودکار را همین که بیرون بروم یا پس از مدتی انتخاب می‌کنم.", "اسم المشروع: «أوراد - البرنامج الشخصي اليومي»، وبالإنجليزية Awrad.": "نام پروژه: «أوراد - برنامه شخصی روزانه»، و به انگلیسی Awrad.", "زرّ الاستعادة صار يفتح الملفات بطريقة تعمل في متصفحات أكثر، ويقبل ملف النسخة مهما كان نوعه المسجّل على الهاتف.": "دکمه‌ی بازیابی اکنون پرونده‌ها را به روشی باز می‌کند که در مرورگرهای بیشتری کار می‌کند و پرونده‌ی نسخه را با هر نوعی که گوشی ثبت کرده باشد می‌پذیرد.", "بطاقة «حفظ بياناتي»: على جهازي مع تذكير ونسخة بضغطة وملف حفظ تلقائي على اللابتوب، أو مزامنة مع Google Drive. وزرّ حفظ بجانب الإعدادات.": "کارت «ذخیره‌ی داده‌هایم»: روی دستگاهم با یادآوری، نسخه‌ی پشتیبان با یک لمس و پرونده‌ی ذخیره‌ی خودکار در لپ‌تاپ، یا همگام‌سازی با Google Drive. و دکمه‌ی ذخیره کنار تنظیمات.", "إصلاح: المحاور المضافة لم تعد تلامس «محاسبة اليوم» في عرض اللابتوب، ورسالة نجاح الاستعادة صارت تبقى ظاهرة.": "اصلاح: محورهای افزوده دیگر در نمای لپ‌تاپ به «محاسبه‌ی امروز» نمی‌چسبند، و پیام موفقیت بازیابی دیگر ناپدید نمی‌شود.", "الأعمال اليومية صارت فوق «التزامي هذا الأسبوع».": "«اعمال روزانه» اکنون بالای «پایبندی من در این هفته» است.", "مراجعة شاملة للهاتف واللابتوب والجهاز اللوحي في اللغتين والألوان والوضعين: ما أكتبه بنفسي لا يُترجم، واختيارات أوضح في الوضع الليلي، وتسميات أعرض، وترتيب أفضل للشاشات الصغيرة والمتوسطة.": "بازبینی کامل برای گوشی، لپ‌تاپ و تبلت در هر دو زبان، همه‌ی رنگ‌ها و هر دو حالت: آنچه خودم می‌نویسم ترجمه نمی‌شود، انتخاب‌ها در حالت شب واضح‌ترند، برچسب‌ها پهن‌ترند و چینش صفحه‌های کوچک و متوسط بهتر است.", "عبارة «أعمال هذا اليوم على حبّ…» في الأعمال اليومية.": "عبارت «اعمال امروز به عشق…» در اعمال روزانه.", "في الأعمال اليومية: لمن هو اليوم من المعصومين (ع).": "در اعمال روزانه: امروز به کدام معصوم (ع) تعلق دارد.", "الأعمال اليومية صارت تذكيراً بأيقونات دون تأشير.": "اعمال روزانه اکنون یادآوری با نماد است و علامت‌زدن ندارد.", "دعاء الصباح في الأعمال اليومية لكل الأيام.": "دعای صباح برای همه‌ی روزها در اعمال روزانه.", "نافذة «الأعمال اليومية» تحت القرآن: الدعاء اليومي كل يوم، ودعاء التوسل يوم الثلاثاء، ودعاء كميل يوم الخميس، ودعاء الندبة يوم الجمعة.": "کادر «اعمال روزانه» زیر قرآن: دعای روز هر روز، دعای توسل سه‌شنبه، دعای کمیل پنجشنبه و دعای ندبه جمعه.", "ساعة نومي في التقدّم (متوسط الأسبوع ورسم آخر 14 يوماً) وفي السجلّ، والتجربة تشمل ساعات النوم والقرآن والختمة.": "ساعت خوابم در «پیشرفت» (میانگین هفته و نمودار 14 روز اخیر) و در دفترچه؛ و آزمایش صفحه ساعت‌های خواب، قرآن و ختم را هم دارد.", "خانة اختيارية بجانب «تنظيم عملية النوم» لساعة الخلود إلى النوم بنظام 24 ساعة، وتظهر في ملف التأشير اليومي.": "کادری اختیاری کنار «نظم خواب» برای ساعت رفتن به رختخواب به صورت 24 ساعته، که در پرونده‌ی علامت‌های روزانه هم می‌آید.", "النسب في «التزامي هذا الأسبوع» تتحدّث فور التأشير على الهاتف أيضاً.": "درصدهای «پایبندی من در این هفته» اکنون در گوشی هم بلافاصله پس از علامت‌زدن به‌روز می‌شوند.", "صلاة الليل نافلة: أؤشّر عليها كما أشاء، ولا تدخل في أي نسبة ولا في إتمام المحور أو اليوم.": "نماز شب مستحب است: هر طور بخواهم علامتش می‌زنم و در هیچ درصدی و در کامل شدن محور یا روز حساب نمی‌شود.", "إصلاح عدّاد القرآن: أول ضغطة + تُحسب دائماً، وتأشير التلاوة يبقى ما دمت تقدّمت اليوم صفحة على الأقل عمّا انتهيت إليه بالأمس، ويُزال حين أعود إليه.": "اصلاح شمارنده‌ی قرآن: نخستین فشار + همیشه حساب می‌شود، و علامت تلاوت تا وقتی می‌ماند که امروز دست‌کم یک صفحه از جایی که دیروز تمام کردم جلوتر باشم، و با برگشتن به آن برداشته می‌شود.", "حين تعود صفحات القرآن لليوم إلى صفر بزر −، يُزال تأشير التلاوة لليوم دائماً.": "وقتی صفحه‌های امروز قرآن با دکمه‌ی − به صفر برگردد، علامت تلاوت امروز همیشه برداشته می‌شود.", "إزالة تحريك البطاقات وتثبيتها؛ البطاقات بترتيبها الأصلي.": "جابه‌جایی و سنجاق کردن کارت‌ها حذف شد؛ کارت‌ها به ترتیب اصلی‌شان هستند.", "مراجعة الاتجاه في اللغتين: الأرقام والرسوم والأشرطة من اليمين في العربية ومن اليسار في الإنجليزية. وإصلاح: زر − في القرآن يزيل تأشير التلاوة الذي أضافه زر +.": "بازبینی جهت در هر دو زبان: اعداد، نمودارها و نوارها در عربی از راست و در انگلیسی از چپ. و اصلاح: دکمه‌ی − در قرآن علامت تلاوتی را که دکمه‌ی + گذاشته بود برمی‌دارد.", "التاريخ الهجري فوق الميلادي في الترويسة، ومحاسبة اليوم مساحةً للتفريغ، ومتابعة الختمة.": "تاریخ قمری بالای تاریخ میلادی در سربرگ، «محاسبه‌ی امروز» به عنوان جایی برای خالی کردن دل، و پیگیری ختم.", "بطاقة القرآن الكريم بزرّي + و− للصفحة التي وصلت إليها مع السورة والجزء والحزب، وطيّ «التزامي هذا الأسبوع»، وزر «انتهيت» في محاسبة اليوم دون أي حفظ.": "کارت قرآن کریم با دکمه‌های + و − برای صفحه‌ای که به آن رسیده‌ام همراه با سوره، جزء و حزب؛ جمع‌شدن «پایبندی من در این هفته»؛ و دکمه‌ی «تمام شد» در محاسبه‌ی امروز بدون هیچ ذخیره‌ای.", "اختيار المظهر في الإعدادات: تلقائي أو نهاري أو ليلي.": "انتخاب ظاهر در تنظیمات: خودکار، روز یا شب.", "إعدادات أرتب: أقسام واضحة، ومفاتيح إظهار، وأزرار موحّدة، وسجلّ التغييرات مطويّ. وإزالة الشعار من الترويسة.": "تنظیمات مرتب‌تر: بخش‌های روشن، کلیدهای نمایش، دکمه‌های یکدست و تاریخچه‌ی تغییرات جمع‌شده. و حذف نشان از سربرگ.", "ترويسة جديدة: التبويبات في الوسط، والألوان والإعدادات على الطرف، وتاريخ اليوم تحت العنوان. وخيار اللغة الإنجليزية في الإعدادات.": "سربرگ تازه: زبانه‌ها در وسط، رنگ‌ها و تنظیمات در گوشه، و تاریخ امروز زیر عنوان. و گزینه‌ی زبان انگلیسی در تنظیمات.", "زر لتجربة الصفحة بنتائج عشوائية لشهرين دون حفظ، وشريط الأيام في الوسط على اللابتوب.": "دکمه‌ای برای آزمایش صفحه با نتایج تصادفی دو ماه بدون ذخیره، و نوار روزها در وسط در لپ‌تاپ.", "نسخة اللابتوب: برنامج اليوم على عمودين، وملخّص جانبي لالتزامي يوماً بيوم، والتقدّم والسجلّ والإعدادات على عمودين.": "نسخه‌ی لپ‌تاپ: برنامه‌ی امروز در دو ستون، خلاصه‌ی کناری پایبندی‌ام روزبه‌روز، و پیشرفت، دفترچه و تنظیمات در دو ستون.", "الإصدار الأول: التأشير اليومي أسبوعاً بأسبوع بدءاً من الاثنين، والتقدّم برسوم الأسابيع والأشهر ومقارنة المحاور وتنبيه عند تراجع الالتزام، والسجلّ للكتب والوسائط والقرآن والتواصل والرياضة مع التصنيف والتاريخ، والإعدادات لإضافة المحاور والبنود وإخفائها وتعديل التصنيفات، والنسخ الاحتياطية وتنزيل CSV والاستعادة، وثلاثة ألوان، وأيقونات، وحركات، والذهبي لكل ما أُنجز، وتصميم للهاتف.": "نسخه‌ی نخست: علامت‌گذاری روزانه هفته‌به‌هفته از دوشنبه؛ پیشرفت با نمودار هفته‌ها و ماه‌ها، مقایسه‌ی محورها و هشدار هنگام افت پایبندی؛ دفترچه برای کتاب‌ها، رسانه‌ها، قرآن، ارتباط و ورزش با دسته‌بندی و تاریخ؛ تنظیمات برای افزودن و پنهان کردن محورها و موردها و ویرایش دسته‌بندی‌ها؛ نسخه‌ی پشتیبان، دانلود CSV و بازیابی؛ سه رنگ، نمادها، حرکت‌ها، طلایی برای هر کار انجام‌شده، و طراحی برای گوشی.", "إضافة اللغة الفارسية: كل نصوص الصفحة بالفارسية، والتاريخ بأسماء الأشهر الفارسية.": "افزودن زبان فارسی: همه‌ی متن‌های صفحه به فارسی، و تاریخ با نام ماه‌ها به فارسی.", "فارسی": "فارسی", "English": "English", "حسابي في نسخة الموقع والتطبيق: إنشاء حساب بالبريد وكلمة المرور أو الدخول بـ Google أو Apple، من بطاقة «حسابي» في أعلى الإعدادات وحدها. بياناتي تُشفَّر على جهازي قبل أن تُرفع، وكلمة المرور لا تصل إلى الخادم، ورمز استعادة يعيد بياناتي إن نسيتها. وتغيير كلمة المرور، والخروج من جهاز أو من كل الأجهزة، وحذف الحساب نهائياً.": "حساب من در نسخه‌ی وب‌سایت و برنامه: ساختن حساب با ایمیل و گذرواژه یا ورود با Google یا Apple، فقط از کارت «حساب من» در بالای تنظیمات. داده‌هایم پیش از بارگذاری روی دستگاهم رمزنگاری می‌شود، گذرواژه‌ام به سرور نمی‌رسد و اگر فراموشش کنم رمز بازیابی داده‌هایم را برمی‌گرداند. همچنین: تغییر گذرواژه، خروج از یک دستگاه یا همه‌ی دستگاه‌ها، و حذف همیشگی حساب.", "مراجعة أمان وتشغيل: تُفحص قيود السجلّ وعدّاد القرآن عند فتح التطبيق كما تُفحص النسخة الاحتياطية، وحين يردّ Google Drive بأنه مشغول ينتظر التطبيق ويعيد المحاولة وحده بفواصل متزايدة دون أن يضيع شيء، وفحص آلي يثبت أن لا مفاتيح سرّية في ملفات التطبيق. و«تقرير الأخطاء» في الإعدادات: أنسخ تقرير ما ظهر من أخطاء وأرسله بنفسي، دون شيء من بياناتي، ولا يُرسل وحده إلى أي مكان.": "بازبینی امنیت و کارکرد: ثبت‌های دفترچه و شمارنده‌ی قرآن هنگام باز شدن برنامه بررسی می‌شوند، همان‌طور که نسخه‌ی پشتیبان؛ وقتی Google Drive می‌گوید شلوغ است، برنامه صبر می‌کند و خودش با فاصله‌های فزاینده دوباره امتحان می‌کند بی‌آنکه چیزی گم شود؛ و بررسی خودکار نشان می‌دهد هیچ کلید محرمانه‌ای در فایل‌های برنامه نیست. و «گزارش خطاها» در تنظیمات: گزارش خطاهای پیش‌آمده را کپی می‌کنم و خودم می‌فرستم، بی هیچ چیزی از داده‌هایم، و خودبه‌خود به جایی فرستاده نمی‌شود.", "إصلاح «أهدافي الأسبوعية»: الهدف الأسبوعي يُحكم على أسبوعه كله، فلا يُحسب عليّ نقص ما دام بلوغ الهدف ممكناً في ما بقي من الأسبوع، والأسبوع الذي بلغت فيه هدفي لا يظهر ناقصاً إن بدأ شهر في وسطه. ورسالة «أتممت البرنامج» لا تتكرّر حين أؤشّر بنداً بهدف أسبوعي أو صلاة الليل بعد إتمام اليوم، ورسالة جديدة حين أبلغ هدفي الأسبوعي. وبطاقة الأهداف تظهر قبل أول تأشير، والضغط على + و− لا يعيد رسم الصفحة ولا يُضيّع مكاني، والبند والعدد المختاران لهدف جديد يبقيان.": "اصلاح «هدف‌های هفتگی من»: هدف هفتگی بر اساس کل هفته‌اش سنجیده می‌شود، پس تا وقتی رسیدن به هدف در روزهای باقی‌مانده ممکن است کمبودی به حسابم نمی‌آید، و هفته‌ای که به هدفم رسیدم اگر ماهی در میانه‌اش آغاز شود ناقص نشان داده نمی‌شود. پیام «برنامه را کامل کردم» وقتی پس از کامل کردن روز، موردی با هدف هفتگی یا نماز شب را علامت می‌زنم تکرار نمی‌شود، و هنگام رسیدن به هدف هفتگی پیامی تازه می‌آید. کارت هدف‌ها پیش از نخستین علامت هم نمایان است، فشردن + و − صفحه را دوباره نمی‌کشد و جایم را گم نمی‌کند، و مورد و عدد انتخاب‌شده برای هدف تازه می‌مانند.", "تجربة أوسع لخمسة أشهر: إخفاء عدة بنود ومحاور وإظهارها، وإضافة ستة محاور وبنود كثيرة وحذفها، دون أن تتغيّر نسب الأسابيع الماضية. وفي الشكل: بطاقات «التقدّم» و«السجلّ» في عمودين متوازنين على اللابتوب، وأسماء الأشهر الطويلة على سطرين في الرسم، وساعة النوم تنزل تحت اسم البند حين يضيق المكان، وأسماء المحاور الطويلة لا تتجاوز سطرين، ولا يُذكر «أكثر ما أتابعه» قبل أن أحدّد مجالاً لأي مدخل.": "آزمایشی گسترده‌تر در پنج ماه: پنهان و نمایان کردن چند مورد و محور، و افزودن شش محور و موردهای بسیار و حذف آن‌ها، بی‌آنکه درصد هفته‌های گذشته تغییر کند. و در ظاهر: کارت‌های «پیشرفت» و «دفترچه» در دو ستون هم‌تراز در لپ‌تاپ، نام‌های بلند ماه‌ها در دو سطر در نمودار، ساعت خواب هنگام کمبود جا زیر نام مورد می‌رود، نام‌های بلند محورها از دو سطر بیشتر نمی‌شود، و پیش از تعیین زمینه برای ثبتی، «بیشترین پیگیری‌ام» نمایش داده نمی‌شود.", "مراجعة شاملة بتجربة خمسة أشهر من الاستخدام: تغيير البرنامج (إخفاء بند أو محور أو حذفه أو إضافته) لا يغيّر نسب الأسابيع الماضية، ولا تضيع علامة مهما أسرعت في التأشير، والصفحة المفتوحة تنتقل إلى اليوم الجديد بعد منتصف الليل، والأيام القادمة لا تُؤشَّر. وإصلاح عدّاد الختمة عند الصفحة 604، وفحص النسخة الاحتياطية قبل استعادتها، وملف الجدول (CSV) لا يبدأ خانةً بصيغة، وقيم الرسوم البيانية تظهر عند الوقوف عليها، ورسالة واضحة إن تعذّر الحفظ على الجهاز.": "بازبینی کامل با آزمایش پنج ماه استفاده: تغییر برنامه (پنهان کردن، حذف یا افزودن یک مورد یا محور) درصد هفته‌های گذشته را تغییر نمی‌دهد، هیچ علامتی هر قدر هم سریع بزنم گم نمی‌شود، صفحه‌ی باز پس از نیمه‌شب به روز تازه می‌رود، و روزهای آینده علامت نمی‌خورند. و اصلاح شمارنده‌ی ختم در صفحه‌ی 604، بررسی نسخه‌ی پشتیبان پیش از بازگردانی، فایل جدول (CSV) هیچ خانه‌ای را با فرمول آغاز نمی‌کند، مقدار نمودارها با نگه‌داشتن نشانگر روی آن‌ها دیده می‌شود، و اگر ذخیره روی دستگاه ممکن نشود پیامی روشن نمایش داده می‌شود.", "إصلاح «التزامي هذا الأسبوع»: كل أيام الأسبوع تُحسب، لا الأيام التي أشّرت فيها فقط. وأهداف أسبوعية للبنود من «التقدّم»، مثل الرياضة 3 مرات في الأسبوع، تبدأ من أسبوعها ولا تغيّر ما سبق.": "اصلاح «پایبندی من در این هفته»: همه‌ی روزهای هفته حساب می‌شوند، نه فقط روزهایی که علامت زدم. و هدف‌های هفتگی برای موردها در «پیشرفت»، مثل ورزش 3 بار در هفته، که از هفته‌ی خودشان شروع می‌شوند و گذشته را تغییر نمی‌دهند.", "أهدافي الأسبوعية": "هدف‌های هفتگی من", ". أفتحها ثم أعود هنا لأسجّل الدخول.": ". آن را باز می‌کنم و بعد برای ورود به این‌جا برمی‌گردم.", "أبدأ من جديد": "از نو شروع می‌کنم", "أحتاج الإنترنت لأسجّل الدخول.": "برای ورود به اینترنت نیاز دارم.", "أحدّد الرمز وأنسخه بنفسي.": "رمز را انتخاب می‌کنم و خودم کپی می‌کنم.", "أحذف حسابي نهائياً": "حسابم را برای همیشه حذف می‌کنم", "أختار كلمة سرّ لبياناتي. تُشفَّر بها بياناتي على جهازي، وأكتبها مرة واحدة على كل جهاز جديد. ليست كلمة مرور حسابي في Google أو Apple، ولا تصل إلى أي خادم.": "برای داده‌هایم یک رمز عبور انتخاب می‌کنم. داده‌هایم با آن روی دستگاهم رمزنگاری می‌شود و آن را یک بار روی هر دستگاه تازه می‌نویسم. این رمز حساب Google یا Apple من المشارطة": "مشارطه", "المراقبة": "مراقبه", "مشارطة الغد": "مشارطه‌ی فردا", "محاسبة اليوم صارت على مراحل اليوم الثلاث، وتُحفظ مع بياناتي: المشارطة (ما شارطت عليه نفسي يبقى أمامي حتى أضغط ✓ حين أفي به)، والمراقبة (ما لم أؤشّره من بنود يومي فأؤشّره من مكانه)، والمحاسبة (بماذا أحسنت؟ بماذا قصّرت؟)، ثم مشارطة الغد. وأراجع محاسباتي في «السجلّ» وأبحث فيها.": "محاسبه‌ی امروز اکنون بر سه مرحله‌ی روز است و همراه داده‌هایم ذخیره می‌شود: مشارطه (آنچه با خودم شرط بستم پیش چشمم می‌ماند تا وقتی به آن وفا کردم ✓ بزنم)، مراقبه (مواردی از امروز که علامت نزده‌ام و همان‌جا علامتشان می‌زنم) و محاسبه (کجا خوب عمل کردم؟ کجا کوتاهی کردم؟)، سپس مشارطه‌ی فردا. محاسبه‌هایم را در «دفترچه» مرور و در آن‌ها جستجو می‌کنم.", "حفظ المحاسبة": "ذخیره‌ی محاسبه", "تحديث المحاسبة": "به‌روزرسانی محاسبه", "محفوظة": "ذخیره شد", "أمس": "دیروز", "وفيت بها": "وفا کردم", "وفيت بمشارطتي، الحمد لله": "به مشارطه‌ام وفا کردم، الحمدلله", "مشارطات وفيت بها": "مشارطه‌هایی که به آن‌ها وفا کردم", "محاسباتي سرّية": "محاسبه‌هایم محرمانه است", "لا تظهر محاسباتي في «السجلّ» إلا بعد إدخال رمز القفل.": "محاسبه‌هایم در «دفترچه» فقط پس از وارد کردن رمز قفل نمایش داده می‌شوند.", "أفتحها برمزي": "با رمزم بازش می‌کنم", "لتكون محاسباتي سرّية، أفعّل القفل برمز من أربعة أرقام فلا تظهر هنا إلا به.": "برای محرمانه ماندن محاسبه‌هایم، قفل چهاررقمی را فعال می‌کنم تا اینجا فقط با آن نمایش داده شوند.", "إخفاء محاسباتي": "پنهان کردن محاسبه‌هایم", "إزالة من هنا": "برداشتن از اینجا", "أزلتها من هنا، وتبقى في «السجلّ».": "از اینجا برداشتم؛ در «دفترچه» می‌ماند.", "أزلت المشارطات من هنا، وتبقى في «السجلّ».": "مشارطه‌ها را از اینجا برداشتم؛ در «دفترچه» می‌مانند.", "تراجع": "بازگرداندن", "إزالة الكل": "برداشتن همه", "أدخل رمزي لأرى محاسباتي": "رمزم را وارد می‌کنم تا محاسبه‌هایم را ببینم", "محاسباتي في «السجلّ» سرّية: لا تظهر إلا برمز القفل في كل مرة أعود إليها، وتُقفل حين أتركها أو يُقفل التطبيق. وأزيل المشارطات السابقة من البطاقة، واحدة أو كلها، وتبقى في «السجلّ»، مع «تراجع».": "محاسبه‌هایم در «دفترچه» محرمانه است: فقط با رمز قفل، هر بار که به آن ه)؛ پیگیری ختم قرآن؛ و هدف‌های هفتگی. پیشرفت با نمودارهای پایبندی هفتگی و ماهانه، مقایسه‌ها و هشدارها. دفترچه با جستجو و فیلتر، و محاسبه‌ها محافظت‌شده پشت قفل. نسخه‌ی پشتیبان و بازگردانی (JSON و CSV برای اکسل). قفل چهاررقمی با شیشه‌ی مات که صفحه را می‌پوشاند. حساب‌ها با رمزنگاری کامل سرتاسری که داده‌هایم را میان دستگاه‌هایم همگام می‌کند (در برنامه: با ایمیل، گوگل و اپل). سه زبان: عربی، انگلیسی و فارسی با تقویم هجری شمسی؛ ظاهر روشن و تیره؛ و نصب روی گوشی به‌صورت برنامه‌ی مستقل.", "لا شيء يطابق بحثي.": "چیزی با جستجویم جور نیست.", "محاسبة اليوم صارت تُحفظ مع بياناتي: ثلاثة أسئلة (بماذا أحسنت؟ بماذا قصّرت؟ ماذا أعزم غداً؟)، وتذكير بما لم أؤشّره من بنود يومي فأؤشّره من مكانه، وما عزمت عليه أمس أمامي. وأراجع محاسباتي في «السجلّ» وأبحث فيها.": "محاسبه‌ی امروز اکنون همراه داده‌هایم ذخیره می‌شود: سه پرسش (کجا خوب عمل کردم؟ کجا کوتاهی کردم؟ برای فردا چه تصمیمی دارم؟)، یادآوری مواردی از امروز که علامت نزده‌ام و همان‌جا علامتشان می‌زنم، و تصمیم دیروزم پیش چشمم. محاسبه‌هایم را در «دفترچه» مرور و در آن‌ها جستجو می‌کنم.", "الخادم غير مهيّأ بعد: جدول البيانات غير موجود.": "سرور هنوز آماده نیست: جدول داده‌ها وجود ندارد.", "كلمة المرور ضعيفة، أختار أطول منها.": "رمز عبور ضعیف است؛ رمز بلندتری انتخاب می‌کنم.", "أُرسلت رسائل كثيرة، أنتظر ساعة ثم أحاول.": "پیام‌های زیادی فرستاده شد؛ یک ساعت صبر می‌کنم و دوباره امتحان می‌کنم.", "التسجيل بالبريد مغلق في إعدادات الخادم.": "ثبت‌نام با ایمیل در تنظیمات سرور بسته است.", "مفتاح الخادم في التطبيق غير صحيح.": "کلید سرور در برنامه درست نیست.", "فُتحت بياناتي على هذا الجهاز.": "داده‌هایم روی این دستگاه باز شد.", "انتهت صلاحية رمز الجهاز أو استُعمل. أطلب رمزاً جديداً من جهازي الآخر.": "کد دستگاه منقضی شده یا قبلاً استفاده شده است. از دستگاه دیگرم کد تازه‌ای می‌گیرم.", "لم يكتمل تجهيز حسابي. أحاول مرة أخرى.": "آماده‌سازی حسابم کامل نشد. دوباره امتحان می‌کنم.", "أكمل": "ادامه", "أكتب رمز الاستعادة، أو رمز الجهاز الذي يظهر على جهازي الآخر، لأفتح بياناتي هنا.": "کد بازیابی، یا کد دستگاهی را که دستگاه دیگرم نشان می‌دهد، می‌نویسم تا داده‌هایم اینجا باز شود.", "رمز الاستعادة أو رمز الجهاز": "کد بازیابی یا کد دستگاه", "دون رمز الاستعادة ودون جهاز آخر مفتوح على حسابي لا يمكن فتح ما في حسابي. أستطيع أن أبدأ من جديد: يُحذف ما في حسابي، وتصبح بيانات هذا الجهاز بيانات حسابي، برمز استعادة جديد. ما على أجهزتي الأخرى يبقى عليها.": "بدون کد بازیابی و بدون دستگاه دیگری که روی حسابم باز باشد، محتوای حسابم باز نمی‌شود. می‌توانم از نو شروع کنم: محتوای حسابم پاک می‌شود و داده‌های این دستگاه، با کد بازیابی تازه، داده‌های حسابم می‌شود. آنچه روی دستگاه‌های دیگرم است همان‌جا می‌ماند.", "أبدأ من جديد بحسابي.": "حسابم را از نو شروع می‌کنم.", "لأفتح بياناتي المشفّرة على هذا الجهاز: أفتح «إدارة الحساب» ثم «إضافة جهاز» على جهازي الآخر، وأمسح رمز QR بكاميرا هذا الجهاز أو أكتب رمز الجهاز هنا. أو أكتب رمز الاستعادة.": "برای باز کردن داده‌های رمزگذاری‌شده‌ام روی این دستگاه: روی دستگاه دیگرم «مدیریت حساب» و سپس «افزودن دستگاه» را باز می‌کنم و کد QR را با دوربین این دستگاه اسکن می‌کنم یا کد دستگاه را اینجا می‌نویسم. یا کد بازیابی را می‌نویسم.", "رمز الجهاز أو رمز الاستعادة": "کد دستگاه یا کد بازیابی", "ليس معي رمز ولا جهاز آخر": "نه کدی دارم نه دستگاه دیگری", "حسابي القديم بكلمة سرّ للبيانات": "حساب قدیمی‌ام با رمز داده‌ها", "إضافة جهاز": "افزودن دستگاه", "أفتح بياناتي على جهاز جديد دون كتابة شيء: أمسح رمز QR بكاميرته، أو أكتب رمز الجهاز فيه.": "داده‌هایم را بدون نوشتن چیزی روی دستگاه تازه باز می‌کنم: کد QR را با دوربینش اسکن می‌کنم، یا کد دستگاه را در آن می‌نویسم.", "على الجهاز الجديد: أسجّل الدخول بحسابي نفسه، ثم أمسح هذا الرمز بالكاميرا أو أكتب رمز الجهاز. يعمل مرة واحدة خلال 15 دقيقة.": "روی دستگاه تازه: با همین حساب وارد می‌شوم، سپس این کد را با دوربین اسکن می‌کنم یا کد دستگاه را می‌نویسم. یک بار و تا ۱۵ دقیقه کار می‌کند.", "رمز QR لإضافة جهاز": "کد QR برای افزودن دستگاه", "تمّ": "تمام", "حسابي جاهز، وبياناتي تُشفَّر على جهازي دون أن أكتب شيئاً. هذا رمز الاستعادة: أحفظه في مكان آمن خارج هذا الجهاز. أحتاجه فقط إن ضاع هذا الجهاز ولم يكن معي جهاز آخر مفتوح على حسابي. لن يظهر مرة أخرى.": "حسابم آماده است و داده‌هایم بدون نوشتن چیزی روی دستگاهم رمزگذاری می‌شود. این کد بازیابی است: آن را جایی امن، بیرون از این دستگاه، نگه می‌دارم. فقط وقتی لازمش دارم که این دستگاه گم شود و دستگاه دیگری روی حسابم باز نباشد. دیگر نشان داده نمی‌شود.", "تجربة: خمسة أشهر مع أوراد": "آزمایش: پنج ماه با أوراد", "الالتزام في الشهر الأول": "پایبندی در ماه اول", "وفي الشهر الأخير": "و در ماه آخر", "بياناتي محفوظة كما هي، ولا يُحفظ شيء من التجربة.": "داده‌هایم همان‌طور که بود حفظ شده و چیزی از آزمایش ذخیره نمی‌شود.", "شاهد التقدّم": "پیشرفت را ببین", "تجربة أوراد": "آزمایش أوراد", "أنا في التجربة الآن: أتنقّل بين التأشير والتقدّم والسجلّ لأرى خمسة أشهر من الاستعمال. بياناتي محفوظة كما هي.": "اکنون در حالت آزمایش هستم: میان علامت‌گذاری، پیشرفت و دفترچه جابه‌جا می‌شوم تا پنج ماه استفاده را ببینم. داده‌هایم همان‌طور که بود حفظ شده است.", "أرى أوراد كاملاً كما لو استعمله شخص خمسة أشهر: تأشيره اليومي، ومحاسباته، وكتبه ووسائطه، وختمته للقرآن، وأهدافه الأسبوعية، وكيف يرتفع التزامه شهراً بعد شهر. بياناتي لا تُمسّ، ولا يُحفظ شيء من التجربة.": "أوراد را کامل می‌بینم، گویی کسی پنج ماه از آن استفاده کرده است: علامت‌گذاری روزانه، محاسبه‌ها، کتاب‌ها و رسانه‌ها، ختم قرآن، هدف‌های هفتگی، و اینکه پایبندی‌اش ماه به ماه چطور بالا می‌رود. به داده‌هایم دست زده نمی‌شود و چیزی از آزمایش ذخیره نمی‌شود.", "أعود إلى بياناتي كما تركتها.": "به داده‌هایم همان‌طور که گذاشته بودم برمی‌گردم.", "خمسة أشهر في دقيقة": "پنج ماه در یک دقیقه", "أبدأ من صفحة التقدّم، ثم أتنقّل كما أشاء.": "از صفحه‌ی پیشرفت شروع می‌شود، سپس هر جا بخواهم می‌روم.", "أنهي التجربة أولاً، ثم أستعيد نسختي.": "اول آزمایش را تمام می‌کنم، سپس نسخه‌ام را بازیابی می‌کنم.", "هذه بيانات التجربة؛ أنهي التجربة أولاً لأنزّل بياناتي.": "این داده‌های آزمایش است؛ اول آزمایش را تمام می‌کنم تا داده‌هایم را بارگیری کنم.", "إعادة المحاور والبنود إلى الأصل": "بازگرداندن محورها و موردها به حالت اصلی", "إعادة التصنيفات إلى الأصل": "بازگرداندن دسته‌بندی‌ها به حالت اصلی"}, FA_FRAG = [["الإصدار الأول من أوراد، يجمع كل ما بُني حتى الآن: محاسبة البرنامج اليومي عبر محاوره وبنوده؛ ومحاسبة اليوم بمراحلها الثلاث (المشارطة، والمراقبة، والمحاسبة)؛ ومتابعة ختمة القرآن؛ وأهداف أسبوعية للبنود. والتقدّم برسوم الالتزام أسبوعياً وشهرياً، والمقارنات، والتنبيهات. والسجلّ بالبحث والتصفية، ومراجعة المحاسبات محمية بالقفل. ونسخ احتياطي واستعادة (JSON، وCSV لـ Excel). وقفل برمز من أربعة أرقام بزجاج مموّه يحجب الصفحة. وحسابات بتشفير كامل من طرف إلى طرف تزامن بياناتي بين أجهزتي (في التطبيق: بالبريد، وGoogle، وApple). وثلاث لغات: العربية، والإنجليزية، والفارسية بالتقويم الهجري الشمسي؛ ومظهر نهاري وليلي؛ ويُثبَّت على الهاتف كتطبيق مستقل.", "نخستین نسخه‌ی اوراد، گردآورنده‌ی هر آنچه تاکنون ساخته شده: پیگیری برنامه‌ی روزانه در محورها و بندهایش؛ محاسبه‌ی روز در سه مرحله‌اش (مشارطه، مراقبه، محاسبه)؛ پیگیری ختم قرآن؛ و هدف‌های هفتگی. پیشرفت با نمودارهای پایبندی هفتگی و ماهانه، مقایسه‌ها و هشدارها. دفترچه با جستجو و فیلتر، و محاسبه‌ها محافظت‌شده پشت قفل. نسخه‌ی پشتیبان و بازگردانی (JSON و CSV برای اکسل). قفل چهاررقمی با شیشه‌ی مات که صفحه را می‌پوشاند. حساب‌ها با رمزنگاری کامل سرتاسری که داده‌هایم را میان دستگاه‌هایم همگام می‌کند (در برنامه: با ایمیل، گوگل و اپل). سه زبان: عربی، انگلیسی و فارسی با تقویم هجری شمسی؛ ظاهر روشن و تیره؛ و نصب روی گوشی به‌صورت برنامه‌ی مستقل."], ["إصلاح «أهدافي الأسبوعية»: الهدف الأسبوعي يُحكم على أسبوعه كله، فلا يُحسب عليّ نقص ما دام بلوغ الهدف ممكناً في ما بقي من الأسبوع، والأسبوع الذي بلغت فيه هدفي لا يظهر ناقصاً إن بدأ شهر في وسطه. ورسالة «أتممت البرنامج» لا تتكرّر حين أؤشّر بنداً بهدف أسبوعي أو صلاة الليل بعد إتمام اليوم، ورسالة جديدة حين أبلغ هدفي الأسبوعي. وبطاقة الأهداف تظهر قبل أول تأشير، والضغط على + و− لا يعيد رسم الصفحة ولا يُضيّع مكاني، والبند والعدد المختاران لهدف جديد يبقيان.", "اصلاح «هدف‌های هفتگی من»: هدف هفتگی بر اساس کل هفته‌اش سنجیده می‌شود، پس تا وقتی رسیدن به هدف در روزهای باقی‌مانده ممکن است کمبودی به حسابم نمی‌آید، و هفته‌ای که به هدفم رسیدم اگر ماهی در میانه‌اش آغاز شود ناقص نشان داده نمی‌شود. پیام «برنامه را کامل کردم» وقتی پس از کامل کردن روز، موردی با هدف هفتگی یا نماز شب را علامت می‌زنم تکرار نمی‌شود، و هنگام رسیدن به هدف هفتگی پیامی تازه می‌آید. کارت هدف‌ها پیش از نخستین علامت هم نمایان است، فشردن + و − صفحه را دوباره نمی‌کشد و جایم را گم نمی‌کند، و مورد و عدد انتخاب‌شده برای هدف تازه می‌مانند."], ["مراجعة شاملة بتجربة خمسة أشهر من الاستخدام: تغيير البرنامج (إخفاء بند أو محور أو حذفه أو إضافته) لا يغيّر نسب الأسابيع الماضية، ولا تضيع علامة مهما أسرعت في التأشير، والصفحة المفتوحة تنتقل إلى اليوم الجديد بعد منتصف الليل، والأيام القادمة لا تُؤشَّر. وإصلاح عدّاد الختمة عند الصفحة 604، وفحص النسخة الاحتياطية قبل استعادتها، وملف الجدول (CSV) لا يبدأ خانةً بصيغة، وقيم الرسوم البيانية تظهر عند الوقوف عليها، ورسالة واضحة إن تعذّر الحفظ على الجهاز.", "بازبینی کامل با آزمایش پنج ماه استفاده: تغییر برنامه (پنهان کردن، حذف یا افزودن یک مورد یا محور) درصد هفته‌های گذشته را تغییر نمی‌دهد، هیچ علامتی هر قدر هم سریع بزنم گم نمی‌شود، صفحه‌ی باز پس از نیمه‌شب به روز تازه می‌رود، و روزهای آینده علامت نمی‌خورند. و اصلاح شمارنده‌ی ختم در صفحه‌ی 604، بررسی نسخه‌ی پشتیبان پیش از بازگردانی، فایل جدول (CSV) هیچ خانه‌ای را با فرمول آغاز نمی‌کند، مقدار نمودارها با نگه‌داشتن نشانگر روی آن‌ها دیده می‌شود، و اگر ذخیره روی دستگاه ممکن نشود پیامی روشن نمایش داده می‌شود."], ["تجربة أوسع لخمسة أشهر: إخفاء عدة بنود ومحاور وإظهارها، وإضافة ستة محاور وبنود كثيرة وحذفها، دون أن تتغيّر نسب الأسابيع الماضية. وفي الشكل: بطاقات «التقدّم» و«السجلّ» في عمودين متوازنين على اللابتوب، وأسماء الأشهر الطويلة على سطرين في الرسم، وساعة النوم تنزل تحت اسم البند حين يضيق المكان، وأسماء المحاور الطويلة لا تتجاوز سطرين، ولا يُذكر «أكثر ما أتابعه» قبل أن أحدّد مجالاً لأي مدخل.", "آزمایشی گسترده‌تر در پنج ماه: پنهان و نمایان کردن چند مورد و محور، و افزودن شش محور و موردهای بسیار و حذف آن‌ها، بی‌آنکه درصد هفته‌های گذشته تغییر کند. و در ظاهر: کارت‌های «پیشرفت» و «دفترچه» در دو ستون هم‌تراز در لپ‌تاپ، نام‌های بلند ماه‌ها در دو سطر در نمودار، ساعت خواب هنگام کمبود جا زیر نام مورد می‌رود، نام‌های بلند محورها از دو سطر بیشتر نمی‌شود، و پیش از تعیین زمینه برای ثبتی، «بیشترین پیگیری‌ام» نمایش داده نمی‌شود."], ["الإصدار الأول: التأشير اليومي أسبوعاً بأسبوع بدءاً من الاثنين، والتقدّم برسوم الأسابيع والأشهر ومقارنة المحاور وتنبيه عند تراجع الالتزام، والسجلّ للكتب والوسائط والقرآن والتواصل والرياضة مع التصنيف والتاريخ، والإعدادات لإضافة المحاور والبنود وإخفائها وتعديل التصنيفات، والنسخ الاحتياطية وتنزيل CSV والاستعادة، وثلاثة ألوان، وأيقونات، وحركات، والذهبي لكل ما أُنجز، وتصميم للهاتف.", "نسخه‌ی نخست: علامت‌گذاری روزانه هفته‌به‌هفته از دوشنبه؛ پیشرفت با نمودار هفته‌ها و ماه‌ها، مقایسه‌ی محورها و هشدار هنگام افت پایبندی؛ دفترچه برای کتاب‌ها، رسانه‌ها، قرآن، ارتباط و ورزش با دسته‌بندی و تاریخ؛ تنظیمات برای افزودن و پنهان کردن محورها و موردها و ویرایش دسته‌بندی‌ها؛ نسخه‌ی پشتیبان، دانلود CSV و بازیابی؛ سه رنگ، نمادها، حرکت‌ها، طلایی برای هر کار انجام‌شده، و طراحی برای گوشی."], ["مراجعة أمان وتشغيل: تُفحص قيود السجلّ وعدّاد القرآن عند فتح التطبيق كما تُفحص النسخة الاحتياطية، وحين يردّ Google Drive بأنه مشغول ينتظر التطبيق ويعيد المحاولة وحده بفواصل متزايدة دون أن يضيع شيء، وفحص آلي يثبت أن لا مفاتيح سرّية في ملفات التطبيق. و«تقرير الأخطاء» في الإعدادات: أنسخ تقرير ما ظهر من أخطاء وأرسله بنفسي، دون شيء من بياناتي، ولا يُرسل وحده إلى أي مكان.", "بازبینی امنیت و کارکرد: ثبت‌های دفترچه و شمارنده‌ی قرآن هنگام باز شدن برنامه بررسی می‌شوند، همان‌طور که نسخه‌ی پشتیبان؛ وقتی Google Drive می‌گوید شلوغ است، برنامه صبر می‌کند و خودش با فاصله‌های فزاینده دوباره امتحان می‌کند بی‌آنکه چیزی گم شود؛ و بررسی خودکار نشان می‌دهد هیچ کلید محرمانه‌ای در فایل‌های برنامه نیست. و «گزارش خطاها» در تنظیمات: گزارش خطاهای پیش‌آمده را کپی می‌کنم و خودم می‌فرستم، بی هیچ چیزی از داده‌هایم، و خودبه‌خود به جایی فرستاده نمی‌شود."], ["حسابي في نسخة الموقع والتطبيق: إنشاء حساب بالبريد وكلمة المرور أو الدخول بـ Google أو Apple، من بطاقة «حسابي» في أعلى الإعدادات وحدها. بياناتي تُشفَّر على جهازي قبل أن تُرفع، وكلمة المرور لا تصل إلى الخادم، ورمز استعادة يعيد بياناتي إن نسيتها. وتغيير كلمة المرور، والخروج من جهاز أو من كل الأجهزة، وحذف الحساب نهائياً.", "حساب من در نسخه‌ی وب‌سایت و برنامه: ساختن حساب با ایمیل و گذرواژه یا ورود با Google یا Apple، فقط از کارت «حساب من» در بالای تنظیمات. داده‌هایم پیش از بارگذاری روی دستگاهم رمزنگاری می‌شود، گذرواژه‌ام به سرور نمی‌رسد و اگر فراموشش کنم رمز بازیابی داده‌هایم را برمی‌گرداند. همچنین: تغییر گذرواژه، خروج از یک دستگاه یا همه‌ی دستگاه‌ها، و حذف همیشگی حساب."], ["بياناتي محفوظة على جهازي هذا وحده، داخل هذا التطبيق، لا تُرسل إلى أي مكان ولا يراها أحد، وتبقى كما هي حين يتحدّث التطبيق. لكنها لا تنتقل وحدها إلى أجهزتي الأخرى، وتضيع إن حذفت التطبيق أو مسحت بيانات المتصفح؛ لذلك أنزّل نسخة احتياطية بين حين وآخر، أستعيدها هنا أو على جهاز آخر، أو أفتحها في Excel.", "داده‌هایم فقط روی همین دستگاه و درون همین برنامه است؛ به جایی فرستاده نمی‌شود و کسی آن را نمی‌بیند، و با به‌روز شدن برنامه همان‌طور می‌ماند. اما خودبه‌خود به دستگاه‌های دیگرم منتقل نمی‌شود و اگر برنامه را حذف کنم یا داده‌های مرورگر را پاک کنم از بین می‌رود؛ برای همین هر از گاهی نسخه‌ی پشتیبان می‌گیرم تا اینجا یا روی دستگاهی دیگر بازیابی‌اش کنم یا در Excel بازش کنم."], ["محاسبة اليوم صارت على مراحل اليوم الثلاث، وتُحفظ مع بياناتي: المشارطة (ما شارطت عليه نفسي يبقى أمامي حتى أضغط ✓ حين أفي به)، والمراقبة (ما لم أؤشّره من بنود يومي فأؤشّره من مكانه)، والمحاسبة (بماذا أحسنت؟ بماذا قصّرت؟)، ثم مشارطة الغد. وأراجع محاسباتي في «السجلّ» وأبحث فيها.", "محاسبه‌ی امروز اکنون بر سه مرحله‌ی روز است و همراه داده‌هایم ذخیره می‌شود: مشارطه (آنچه با خودم شرط بستم پیش چشمم می‌ماند تا وقتی به آن وفا کردم ✓ بزنم)، مراقبه (مواردی از امروز که علامت نزده‌ام و همان‌جا علامتشان می‌زنم) و محاسبه (کجا خوب عمل کردم؟ کجا کوتاهی کردم؟)، سپس مشارطه‌ی فردا. محاسبه‌هایم را در «دفترچه» مرور و در آن‌ها جستجو می‌کنم."], ["أحدّد كم مرة في الأسبوع أريد بنداً ما، فتُحسب نسبته على هذا الهدف لا على أيام الأسبوع كلها، ولا يُحسب عليّ نقص ما دام بلوغ الهدف ممكناً في ما بقي من الأسبوع. يبدأ الهدف من هذا الأسبوع ولا يغيّر نسب الأسابيع الماضية.", "تعیین می‌کنم هر مورد را چند بار در هفته می‌خواهم، تا درصدش بر اساس همین هدف حساب شود نه همه‌ی روزهای هفته؛ و تا وقتی رسیدن به هدف در روزهای باقی‌مانده‌ی هفته ممکن است، کمبودی به حسابم نمی‌آید. هدف از همین هفته شروع می‌شود و درصد هفته‌های گذشته را تغییر نمی‌دهد."], ["محاسبة اليوم صارت تُحفظ مع بياناتي: ثلاثة أسئلة (بماذا أحسنت؟ بماذا قصّرت؟ ماذا أعزم غداً؟)، وتذكير بما لم أؤشّره من بنود يومي فأؤشّره من مكانه، وما عزمت عليه أمس أمامي. وأراجع محاسباتي في «السجلّ» وأبحث فيها.", "محاسبه‌ی امروز اکنون همراه داده‌هایم ذخیره می‌شود: سه پرسش (کجا خوب عمل کردم؟ کجا کوتاهی کردم؟ برای فردا چه تصمیمی دارم؟)، یادآوری مواردی از امروز که علامت نزده‌ام و همان‌جا علامتشان می‌زنم، و تصمیم دیروزم پیش چشمم. محاسبه‌هایم را در «دفترچه» مرور و در آن‌ها جستجو می‌کنم."], ["دون رمز الاستعادة ودون جهاز آخر مفتوح على حسابي لا يمكن فتح ما في حسابي. أستطيع أن أبدأ من جديد: يُحذف ما في حسابي، وتصبح بيانات هذا الجهاز بيانات حسابي، برمز استعادة جديد. ما على أجهزتي الأخرى يبقى عليها.", "بدون کد بازیابی و بدون دستگاه دیگری که روی حسابم باز باشد، محتوای حسابم باز نمی‌شود. می‌توانم از نو شروع کنم: محتوای حسابم پاک می‌شود و داده‌های این دستگاه، با کد بازیابی تازه، داده‌های حسابم می‌شود. آنچه روی دستگاه‌های دیگرم است همان‌جا می‌ماند."], ["أرى أوراد كاملاً كما لو استعمله شخص خمسة أشهر: تأشيره اليومي، ومحاسباته، وكتبه ووسائطه، وختمته للقرآن، وأهدافه الأسبوعية، وكيف يرتفع التزامه شهراً بعد شهر. بياناتي لا تُمسّ، ولا يُحفظ شيء من التجربة.", "أوراد را کامل می‌بینم، گویی کسی پنج ماه از آن استفاده کرده است: علامت‌گذاری روزانه، محاسبه‌ها، کتاب‌ها و رسانه‌ها، ختم قرآن، هدف‌های هفتگی، و اینکه پایبندی‌اش ماه به ماه چطور بالا می‌رود. به داده‌هایم دست زده نمی‌شود و چیزی از آزمایش ذخیره نمی‌شود."], ["بياناتي محفوظة في حسابي وحدي، لا يطّلع عليها أحد غيري حتى لو شاركت هذه الصفحة. وتبقى كما هي حين تُحدَّث الصفحة أو تُطوَّر. ومع ذلك أنزّل نسخة احتياطية بين حين وآخر، أستعيدها هنا أو أفتحها في Excel.", "داده‌هایم فقط در حساب خودم ذخیره است و هیچ کس جز من آن را نمی‌بیند، حتی اگر این صفحه را به اشتراک بگذارم. و با به‌روز شدن یا تکمیل صفحه همان‌طور می‌ماند. با این حال هر از گاهی نسخه‌ی پشتیبان می‌گیرم تا اینجا بازیابی‌اش کنم یا در Excel بازش کنم."], ["كلمة المرور لا تُرسل إلى الخادم ولا تُحفظ فيه: يشتقّ منها التطبيق على جهازي ما يُدخلني وما يفتح بياناتي. لذلك لا يستطيع أحد استعادة بياناتي إن نسيتها إلا برمز الاستعادة الذي يظهر بعد إنشاء الحساب.", "گذرواژه‌ام نه به سرور فرستاده می‌شود و نه در آن نگه داشته می‌شود: برنامه روی دستگاهم از آن هم کلید ورود و هم کلید باز کردن داده‌هایم را می‌سازد. پس اگر فراموشش کنم، فقط رمز بازیابی‌ای که پس از ساختن حساب نشان داده می‌شود داده‌هایم را برمی‌گرداند."], ["حسابي جاهز، وبياناتي تُشفَّر على جهازي دون أن أكتب شيئاً. هذا رمز الاستعادة: أحفظه في مكان آمن خارج هذا الجهاز. أحتاجه فقط إن ضاع هذا الجهاز ولم يكن معي جهاز آخر مفتوح على حسابي. لن يظهر مرة أخرى.", "حسابم آماده است و داده‌هایم بدون نوشتن چیزی روی دستگاهم رمزگذاری می‌شود. این کد بازیابی است: آن را جایی امن، بیرون از این دستگاه، نگه می‌دارم. فقط وقتی لازمش دارم که این دستگاه گم شود و دستگاه دیگری روی حسابم باز نباشد. دیگر نشان داده نمی‌شود."], ["دون رمز الاستعادة لا يمكن فتح ما في حسابي. أستطيع أن أبدأ من جديد: يُحذف ما في حسابي، وتصبح بيانات هذا الجهاز بيانات حسابي، بكلمة مرور جديدة ورمز استعادة جديد. ما على أجهزتي الأخرى يبقى عليها.", "بدون رمز بازیابی، آنچه در حسابم است باز نمی‌شود. می‌توانم از نو شروع کنم: آنچه در حسابم است حذف می‌شود و داده‌های این دستگاه داده‌های حسابم می‌شود، با گذرواژه و رمز بازیابی تازه. آنچه روی دستگاه‌های دیگرم است روی آن‌ها می‌ماند."], ["القفل برمز سرّي: رمز من أربعة أرقام يُطلب عند فتح التطبيق، وكل ما خلفه ضبابي حتى يُفتح. أغيّره أو أوقفه من الإعدادات، وأقفل يدوياً من زرّ القفل، وأختار القفل التلقائي فور مغادرتي أو بعد مدة.", "قفل با رمز: رمزی چهاررقمی که هنگام باز کردن برنامه پرسیده می‌شود و همه چیز پشت آن تا باز شدن مه‌آلود است. از تنظیمات تغییرش می‌دهم یا خاموشش می‌کنم، با دکمه‌ی قفل دستی قفل می‌کنم، و قفل خودکار را همین که بیرون بروم یا پس از مدتی انتخاب می‌کنم."], ["محاسباتي في «السجلّ» سرّية: لا تظهر إلا برمز القفل في كل مرة أعود إليها، وتُقفل حين أتركها أو يُقفل التطبيق. وأزيل المشارطات السابقة من البطاقة، واحدة أو كلها، وتبقى في «السجلّ»، مع «تراجع».", "محاسبه‌هایم در «دفترچه» محرمانه است: فقط با رمز قفل، هر بار که به آن برمی‌گردم، نمایش داده می‌شود و وقتی ترکش کنم یا برنامه قفل شود دوباره قفل می‌شود. و مشارطه‌های گذشته را، یکی یا همه، از کارت برمی‌دارم و در «دفترچه» می‌مانند، با «بازگرداندن»."], ["مراجعة شاملة للهاتف واللابتوب والجهاز اللوحي في اللغتين والألوان والوضعين: ما أكتبه بنفسي لا يُترجم، واختيارات أوضح في الوضع الليلي، وتسميات أعرض، وترتيب أفضل للشاشات الصغيرة والمتوسطة.", "بازبینی کامل برای گوشی، لپ‌تاپ و تبلت در هر دو زبان، همه‌ی رنگ‌ها و هر دو حالت: آنچه خودم می‌نویسم ترجمه نمی‌شود، انتخاب‌ها در حالت شب واضح‌ترند، برچسب‌ها پهن‌ترند و چینش صفحه‌های کوچک و متوسط بهتر است."], ["إصلاح «التزامي هذا الأسبوع»: كل أيام الأسبوع تُحسب، لا الأيام التي أشّرت فيها فقط. وأهداف أسبوعية للبنود من «التقدّم»، مثل الرياضة 3 مرات في الأسبوع، تبدأ من أسبوعها ولا تغيّر ما سبق.", "اصلاح «پایبندی من در این هفته»: همه‌ی روزهای هفته حساب می‌شوند، نه فقط روزهایی که علامت زدم. و هدف‌های هفتگی برای موردها در «پیشرفت»، مثل ورزش 3 بار در هفته، که از هفته‌ی خودشان شروع می‌شوند و گذشته را تغییر نمی‌دهند."], ["أنشئ حساباً لتتزامن بياناتي بين الموقع وتطبيقَي الهاتف. تُشفَّر بياناتي على جهازي قبل أن تُرفع، فلا يقرؤها أحد غيري، ولا القائمون على التطبيق. والتطبيق يعمل كاملاً دون حساب.", "حسابی می‌سازم تا داده‌هایم میان وب‌سایت و برنامه‌های گوشی همگام شود. داده‌هایم پیش از بارگذاری روی دستگاهم رمزنگاری می‌شود، پس هیچ‌کس جز من، حتی گردانندگان برنامه، نمی‌تواند آن را بخواند. برنامه بدون حساب هم کامل کار می‌کند."], ["أزلت «تجربة الصفحة» نهائياً. وفي «السجلّ» زرّ لحذف محاسبة يوم بعينه، مع «تراجع»، وفراغ بين المحاسبات. وصحّحت كتابة كلمات مثل «أحسنت» و«وفيت بها» حتى لا تُقرأ تاؤها مربوطة.", "«آزمایش صفحه» برای همیشه حذف شد. در «دفترچه» دکمه‌ای برای حذف محاسبه‌ی یک روز، با «بازگرداندن»، و فاصله میان محاسبه‌ها. و نوشتن فعل‌هایی که به تای متکلم ختم می‌شوند درست شد تا تای پایانی‌شان گرد خوانده نشود."], ["لأفتح بياناتي المشفّرة على هذا الجهاز: أفتح «إدارة الحساب» ثم «إضافة جهاز» على جهازي الآخر، وأمسح رمز QR بكاميرا هذا الجهاز أو أكتب رمز الجهاز هنا. أو أكتب رمز الاستعادة.", "برای باز کردن داده‌های رمزگذاری‌شده‌ام روی این دستگاه: روی دستگاه دیگرم «مدیریت حساب» و سپس «افزودن دستگاه» را باز می‌کنم و کد QR را با دوربین این دستگاه اسکن می‌کنم یا کد دستگاه را اینجا می‌نویسم. یا کد بازیابی را می‌نویسم."], ["مراجعة الاتجاه في اللغتين: الأرقام والرسوم والأشرطة من اليمين في العربية ومن اليسار في الإنجليزية. وإصلاح: زر − في القرآن يزيل تأشير التلاوة الذي أضافه زر +.", "بازبینی جهت در هر دو زبان: اعداد، نمودارها و نوارها در عربی از راست و در انگلیسی از چپ. و اصلاح: دکمه‌ی − در قرآن علامت تلاوتی را که دکمه‌ی + گذاشته بود برمی‌دارد."], ["أنزّل سجلّي وتأشيري في جداول تُفتح في Excel، أو أستعيد نسخة احتياطية أخذتها من هنا أو من جهاز آخر أو من نسخة claude.ai، فتُدمج مع بياناتي دون أن تمسح شيئاً.", "دفترچه و علامت‌هایم را به صورت جدول Excel دانلود می‌کنم، یا نسخه‌ی پشتیبانی را که اینجا، روی دستگاهی دیگر یا از نسخه‌ی claude.ai گرفته‌ام بازیابی می‌کنم تا بی‌آنکه چیزی پاک شود با داده‌هایم ادغام شود."], ["أختار كلمة سرّ لبياناتي. تُشفَّر بها بياناتي على جهازي، وأكتبها مرة واحدة على كل جهاز جديد. ليست كلمة مرور حسابي في Google أو Apple، ولا تصل إلى أي خادم.", "برای داده‌هایم یک رمز عبور انتخاب می‌کنم. داده‌هایم با آن روی دستگاهم رمزنگاری می‌شود و آن را یک بار روی هر دستگاه تازه می‌نویسم. این رمز حساب Google یا Apple من نیست و به هیچ سروری نمی‌رسد."], ["بطاقة القرآن الكريم بزرّي + و− للصفحة التي وصلت إليها مع السورة والجزء والحزب، وطيّ «التزامي هذا الأسبوع»، وزر «انتهيت» في محاسبة اليوم دون أي حفظ.", "کارت قرآن کریم با دکمه‌های + و − برای صفحه‌ای که به آن رسیده‌ام همراه با سوره، جزء و حزب؛ جمع‌شدن «پایبندی من در این هفته»؛ و دکمه‌ی «تمام شد» در محاسبه‌ی امروز بدون هیچ ذخیره‌ای."], ["إصلاح عدّاد القرآن: أول ضغطة + تُحسب دائماً، وتأشير التلاوة يبقى ما دمت تقدّمت اليوم صفحة على الأقل عمّا انتهيت إليه بالأمس، ويُزال حين أعود إليه.", "اصلاح شمارنده‌ی قرآن: نخستین فشار + همیشه حساب می‌شود، و علامت تلاوت تا وقتی می‌ماند که امروز دست‌کم یک صفحه از جایی که دیروز تمام کردم جلوتر باشم، و با برگشتن به آن برداشته می‌شود."], ["إن ظهر لي خطأ أنسخ تقريره وأرسله بنفسي لمن يساعدني. فيه رقم الإصدار والمتصفح ورسائل الأخطاء فقط، لا شيء من بياناتي، ولا يُرسل وحده إلى أي مكان.", "اگر خطایی پیش آمد، گزارشش را کپی می‌کنم و خودم برای کسی که کمکم می‌کند می‌فرستم. فقط شماره‌ی نسخه، مرورگر و پیام‌های خطا در آن است، نه چیزی از داده‌هایم، و خودبه‌خود به جایی فرستاده نمی‌شود."], ["أسجّل الدخول بحسابي في Google مرة واحدة على كل جهاز، فتُحفظ بياناتي في مجلد خاص بالتطبيق داخل Drive لا يراه غيره، وتتزامن بين أجهزتي تلقائياً.", "روی هر دستگاه یک بار با حساب Google وارد می‌شوم تا داده‌هایم در پوشه‌ای مخصوص برنامه در Drive ذخیره شود که جز آن دیده نمی‌شود، و خودکار میان دستگاه‌هایم همگام شود."], ["النسخة المنزّلة تعمل من جهازي دون إنترنت، وتحفظ بياناتها في المتصفح نفسه فقط. لأنقل بياناتي إليها أستعمل «نسخة احتياطية كاملة» ثم «استعادة».", "نسخه‌ی دانلودشده بدون اینترنت روی دستگاهم کار می‌کند و داده‌هایش را فقط در همان مرورگر ذخیره می‌کند. برای انتقال داده‌هایم به آن از «نسخه‌ی پشتیبان کامل» و سپس «بازیابی» استفاده می‌کنم."], ["بياناتي في مجلد خاص بالتطبيق داخل Drive، وتتزامن تلقائياً حين أفتح التطبيق وبعد كل تغيير. وأستطيع إلغاء الإذن في أي وقت من حسابي في Google.", "داده‌هایم در پوشه‌ای مخصوص برنامه در Drive است و هنگام باز کردن برنامه و پس از هر تغییر خودکار همگام می‌شود. هر وقت بخواهم می‌توانم این اجازه را از حساب Google خود لغو کنم."], ["مساحة أفرّغ فيها ما في نفسي من تقصير أو إنجاز. يُحفظ ما أكتبه تلقائياً ولا يُعرض مرة أخرى، ولا يظهر إلا ضمن النسخة الاحتياطية حين أنزّلها.", "جایی برای اینکه کوتاهی‌ها یا دستاوردهایم را بیرون بریزم. نوشته‌ام خودکار ذخیره می‌شود و دوباره نمایش داده نمی‌شود، و فقط در نسخه‌ی پشتیبان، وقتی دانلودش کنم، می‌آید."], ["أختار ملفاً مرة واحدة، ويُفضَّل أن يكون في مجلد Google Drive أو iCloud على جهازي، فيحدّثه التطبيق بنفسه بعد كل تغيير وقبل إغلاق النافذة.", "یک بار پرونده‌ای انتخاب می‌کنم، ترجیحاً در پوشه‌ی Google Drive یا iCloud روی دستگاهم، و برنامه پس از هر تغییر و پیش از بستن پنجره خودش آن را به‌روز می‌کند."], ["أُنشئ محوراً جديداً بجانب المحاور الأربعة، ثم أضيف إليه بنوده من قسم «البنود» أعلاه، وأستطيع إخفاء أي محور من مربّع الإظهار بجانب اسمه.", "محور تازه‌ای کنار چهار محور می‌سازم، سپس موردهایش را از بخش «موردها» در بالا می‌افزایم، و هر محوری را می‌توانم با کادر نمایش کنار نامش پنهان کنم."], ["بطاقة «حفظ بياناتي»: على جهازي مع تذكير ونسخة بضغطة وملف حفظ تلقائي على اللابتوب، أو مزامنة مع Google Drive. وزرّ حفظ بجانب الإعدادات.", "کارت «ذخیره‌ی داده‌هایم»: روی دستگاهم با یادآوری، نسخه‌ی پشتیبان با یک لمس و پرونده‌ی ذخیره‌ی خودکار در لپ‌تاپ، یا همگام‌سازی با Google Drive. و دکمه‌ی ذخیره کنار تنظیمات."], ["أختار ملف نسخة احتياطية فيُدمج مع بياناتي الحالية دون أن يمسح شيئاً. وبياناتي في حسابي، فما أستعيده على أي جهاز يظهر على أجهزتي كلها.", "پرونده‌ی نسخه‌ی پشتیبان را انتخاب می‌کنم تا بی‌آنکه چیزی پاک شود با داده‌های فعلی‌ام ادغام شود. داده‌هایم در حسابم است، پس آنچه روی هر دستگاهی بازیابی کنم روی همه‌ی دستگاه‌هایم دیده می‌شود."], ["أملأ الصفحة بنتائج عشوائية لشهرين لأرى كيف تظهر الرسوم والتنبيهات والسجلّ. لا يُحفظ منها شيء، وبياناتي تعود كما هي حين أنهي التجربة.", "صفحه را با نتایج تصادفی دو ماه پر می‌کنم تا ببینم نمودارها، هشدارها و دفترچه چگونه دیده می‌شوند. چیزی از آن ذخیره نمی‌شود و داده‌هایم وقتی آزمایش را تمام کنم همان‌طور برمی‌گردد."], ["نافذة «الأعمال اليومية» تحت القرآن: الدعاء اليومي كل يوم، ودعاء التوسل يوم الثلاثاء، ودعاء كميل يوم الخميس، ودعاء الندبة يوم الجمعة.", "کادر «اعمال روزانه» زیر قرآن: دعای روز هر روز، دعای توسل سه‌شنبه، دعای کمیل پنجشنبه و دعای ندبه جمعه."], ["لحماية بياناتي لا يُفتح القفل دون الرمز. أستطيع إزالته بمسح بيانات هذا الجهاز، ثم أستعيدها من نسختي الاحتياطية أو من Google Drive.", "برای حفاظت از داده‌هایم، قفل بدون رمز باز نمی‌شود. می‌توانم با پاک کردن داده‌های این دستگاه آن را بردارم و سپس داده‌ها را از نسخه‌ی پشتیبانم یا از Google Drive بازیابی کنم."], ["هذا رمز الاستعادة. أحفظه في مكان آمن خارج هذا الجهاز: هو الطريق الوحيد إلى بياناتي المشفّرة إن نسيت كلمة المرور. لن يظهر مرة أخرى.", "این رمز بازیابی است. آن را جایی امن، بیرون از این دستگاه، نگه می‌دارم: اگر گذرواژه را فراموش کنم، تنها راه رسیدن به داده‌های رمزنگاری‌شده‌ام است. دیگر نشان داده نمی‌شود."], ["حين يكون جهازي متصلاً بالإنترنت يفتح التطبيق آخر إصدار تلقائياً، ودون إنترنت يفتح آخر إصدار حفظه. بياناتي وإعداداتي تبقى كما هي.", "وقتی دستگاهم به اینترنت وصل است، برنامه خودبه‌خود آخرین نسخه را باز می‌کند و بدون اینترنت آخرین نسخه‌ای را که ذخیره کرده. داده‌ها و تنظیماتم همان‌طور می‌ماند."], ["ترويسة جديدة: التبويبات في الوسط، والألوان والإعدادات على الطرف، وتاريخ اليوم تحت العنوان. وخيار اللغة الإنجليزية في الإعدادات.", "سربرگ تازه: زبانه‌ها در وسط، رنگ‌ها و تنظیمات در گوشه، و تاریخ امروز زیر عنوان. و گزینه‌ی زبان انگلیسی در تنظیمات."], ["عاد مظهر الزجاج المموّه خلف القفل: الصفحة تظهر خلفه مموّهة لا تُقرأ، مع بقاء كل الأمان — لا يصلها لمس ولا ضغط ولا لوحة مفاتيح.", "ظاهر شیشه‌ی مات پشت قفل بازگشت: صفحه پشت آن مات و ناخوانا دیده می‌شود، با حفظ همه‌ی امنیت — هیچ لمس، کلیک یا صفحه‌کلیدی به آن نمی‌رسد."], ["بياناتي محفوظة في حسابي على Claude، فأستطيع إزالة القفل عن هذا الجهاز دون أن أفقد شيئاً، ثم أختار رمزاً جديداً من الإعدادات.", "داده‌هایم در حساب Claude من ذخیره است، پس می‌توانم بی‌آنکه چیزی از دست بدهم قفل را از این دستگاه بردارم و سپس از تنظیمات رمز تازه‌ای انتخاب کنم."], ["رمز من أربعة أرقام يُطلب حين أفتح التطبيق، فلا يطّلع أحد على محاسبتي وسجلّي إن أمسك هاتفي. الرمز يبقى على هذا الجهاز وحده.", "رمزی چهاررقمی که هنگام باز کردن برنامه پرسیده می‌شود، تا اگر کسی گوشی‌ام را برداشت، محاسبه و دفترچه‌ام را نبیند. رمز فقط روی همین دستگاه می‌ماند."], ["على الجهاز الجديد: أسجّل الدخول بحسابي نفسه، ثم أمسح هذا الرمز بالكاميرا أو أكتب رمز الجهاز. يعمل مرة واحدة خلال 15 دقيقة.", "روی دستگاه تازه: با همین حساب وارد می‌شوم، سپس این کد را با دوربین اسکن می‌کنم یا کد دستگاه را می‌نویسم. یک بار و تا ۱۵ دقیقه کار می‌کند."], ["لم يُفعَّل الربط في هذه النسخة بعد: يحتاج التطبيق مفتاح Google الخاص به. إلى أن يُفعَّل تبقى بياناتي محفوظة على جهازي.", "اتصال در این نسخه هنوز فعال نشده است: برنامه به کلید Google مخصوص خودش نیاز دارد. تا آن موقع داده‌هایم روی دستگاهم ذخیره می‌ماند."], ["قفل أشدّ: حين يظهر القفل تختفي الصفحة خلفه كلها، ولا يصل إليها لمس ولا ضغط ولا لوحة مفاتيح حتى يُفتح، في كل المتصفحات.", "قفل محکم‌تر: وقتی قفل نمایش داده می‌شود، صفحه‌ی پشت آن کاملاً پنهان می‌شود و هیچ لمس، کلیک یا صفحه‌کلیدی تا باز شدنش به آن نمی‌رسد، در همه‌ی مرورگرها."], ["نسخة اللابتوب: برنامج اليوم على عمودين، وملخّص جانبي لالتزامي يوماً بيوم، والتقدّم والسجلّ والإعدادات على عمودين.", "نسخه‌ی لپ‌تاپ: برنامه‌ی امروز در دو ستون، خلاصه‌ی کناری پایبندی‌ام روزبه‌روز، و پیشرفت، دفترچه و تنظیمات در دو ستون."], ["زرّ الاستعادة صار يفتح الملفات بطريقة تعمل في متصفحات أكثر، ويقبل ملف النسخة مهما كان نوعه المسجّل على الهاتف.", "دکمه‌ی بازیابی اکنون پرونده‌ها را به روشی باز می‌کند که در مرورگرهای بیشتری کار می‌کند و پرونده‌ی نسخه را با هر نوعی که گوشی ثبت کرده باشد می‌پذیرد."], ["ساعة نومي في التقدّم (متوسط الأسبوع ورسم آخر 14 يوماً) وفي السجلّ، والتجربة تشمل ساعات النوم والقرآن والختمة.", "ساعت خوابم در «پیشرفت» (میانگین هفته و نمودار 14 روز اخیر) و در دفترچه؛ و آزمایش صفحه ساعت‌های خواب، قرآن و ختم را هم دارد."], ["أختار كلمة مرور جديدة. ولأن بياناتي مشفّرة، أكتب معها رمز الاستعادة، إلا إن كان هذا الجهاز مفتوحاً على حسابي.", "گذرواژه‌ی تازه‌ای انتخاب می‌کنم. چون داده‌هایم رمزنگاری شده‌اند، رمز بازیابی را هم کنارش می‌نویسم، مگر این‌که این دستگاه روی حسابم باز باشد."], ["أنا في التجربة الآن: أتنقّل بين التأشير والتقدّم والسجلّ لأرى خمسة أشهر من الاستعمال. بياناتي محفوظة كما هي.", "اکنون در حالت آزمایش هستم: میان علامت‌گذاری، پیشرفت و دفترچه جابه‌جا می‌شوم تا پنج ماه استفاده را ببینم. داده‌هایم همان‌طور که بود حفظ شده است."], ["التحديثات تصلني تلقائياً: حين تُطوَّر الصفحة تتحدّث عندي عند فتحها التالي، وبياناتي وإعداداتي تبقى كما هي.", "به‌روزرسانی‌ها خودبه‌خود می‌رسند: وقتی صفحه تکمیل شود، دفعه‌ی بعد که بازش کنم به‌روز می‌شود و داده‌ها و تنظیماتم همان‌طور می‌ماند."], ["إصلاح: المحاور المضافة لم تعد تلامس «محاسبة اليوم» في عرض اللابتوب، ورسالة نجاح الاستعادة صارت تبقى ظاهرة.", "اصلاح: محورهای افزوده دیگر در نمای لپ‌تاپ به «محاسبه‌ی امروز» نمی‌چسبند، و پیام موفقیت بازیابی دیگر ناپدید نمی‌شود."], ["خانة اختيارية بجانب «تنظيم عملية النوم» لساعة الخلود إلى النوم بنظام 24 ساعة، وتظهر في ملف التأشير اليومي.", "کادری اختیاری کنار «نظم خواب» برای ساعت رفتن به رختخواب به صورت 24 ساعته، که در پرونده‌ی علامت‌های روزانه هم می‌آید."], ["إعدادات أرتب: أقسام واضحة، ومفاتيح إظهار، وأزرار موحّدة، وسجلّ التغييرات مطويّ. وإزالة الشعار من الترويسة.", "تنظیمات مرتب‌تر: بخش‌های روشن، کلیدهای نمایش، دکمه‌های یکدست و تاریخچه‌ی تغییرات جمع‌شده. و حذف نشان از سربرگ."], ["مساحة أفرّغ فيها ما في نفسي من تقصير أو إنجاز. لا يُحفظ شيء مما أكتبه، وحين أضغط «انتهيت» يُمحى كله.", "جایی برای اینکه کوتاهی‌ها یا دستاوردهایم را از دل بیرون بریزم. هیچ چیز از نوشته‌ام ذخیره نمی‌شود و وقتی «تمام شد» را بزنم همه‌اش پاک می‌شود."], ["أختار كيف تُحفظ بياناتي. في الحالتين يُحفظ كل تأشير على جهازي فوراً، ولا يضيع شيء حين أغلق النافذة.", "انتخاب می‌کنم داده‌هایم چگونه ذخیره شوند. در هر دو حالت هر علامت فوراً روی دستگاهم ذخیره می‌شود و با بستن پنجره چیزی از دست نمی‌رود."], ["التطبيق مقفل برمز من أربعة أرقام يُطلب حين أفتحه، فلا يطّلع أحد على محاسبتي وسجلّي إن أمسك هاتفي.", "برنامه با رمزی چهاررقمی قفل است که هنگام باز کردنش پرسیده می‌شود، تا اگر کسی گوشی‌ام را برداشت، محاسبه و دفترچه‌ام را نبیند."], ["بياناتي مشفّرة على جهازي ومتزامنة مع حسابي بين أجهزتي. أدير الحساب من «حسابي» في أعلى الإعدادات.", "داده‌هایم روی دستگاهم رمزنگاری می‌شود و از راه حسابم میان دستگاه‌هایم همگام است. حساب را از «حساب من» در بالای تنظیمات مدیریت می‌کنم."], ["مشارطة في أول اليوم، ومراقبة في أثنائه، ومحاسبة في آخره. تُحفظ مع بياناتي، وأراجعها في «السجلّ».", "مشارطه در آغاز روز، مراقبه در طول آن، و محاسبه در پایانش. همراه داده‌هایم ذخیره می‌شود و در «دفترچه» مرورش می‌کنم."], ["أُخفي بنداً لا أحتاجه، أو أضيف بنداً جديداً إلى أي محور. إخفاء البند لا يحذف تأشيراته السابقة.", "موردی را که لازم ندارم پنهان می‌کنم یا مورد تازه‌ای به هر محور می‌افزایم. پنهان کردن مورد، علامت‌های گذشته‌اش را پاک نمی‌کند."], ["يُقفل التطبيق حين أغادره، أو بعد مدة لا أستعمله فيها. ويُطلب الرمز دائماً حين أفتحه من جديد.", "برنامه وقتی از آن بیرون می‌روم یا مدتی از آن استفاده نمی‌کنم قفل می‌شود، و هر بار که دوباره بازش کنم رمز پرسیده می‌شود."], ["حين أؤشّر على بنود يومي في «التأشير» تظهر هنا رسوم تقدّمي ومقارنة أسابيعي وأشهري وتنبيهاتي.", "وقتی موردهای روزم را در «علا
