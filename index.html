			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

<script>
/* ===== Saving my data in the installed app =====
   Two ways, my choice in Settings:
   - "device": every tick is written on this device at once; a reminder and a one-tap backup, and on laptops an
     automatic file I pick once (inside a Drive / iCloud folder if I like) kept up to date after each change and on close.
   - "drive": the app keeps one file in its own hidden folder of my Google Drive and merges it with every device.
   Merging is per cell: each tick, bedtime, log entry, the Quran counter and my settings carry the time they last
   changed, so an untick on one device is not undone by another. */
(function () {

  var K = { mode: 'awrad:saveMode', last: 'awrad:lastBackup', meta: 'awrad:meta', drive: 'awrad:drive', remind: 'awrad:remind',
    authState: 'awrad:authState', authErr: 'awrad:authErr', dirty: 'awrad:dirty', first: 'awrad:firstData', fileAt: 'awrad:fileAt' };
  var DAY = 864e5, REMIND_DAYS = 7;

  function EN() { return document.documentElement.lang === 'en'; }
  function T(ar, en) { return EN() ? en : ar; }

.entry { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding-block: 4px; padding-inline: 12px 6px; font-size: 13px; max-width: 100%; }

.gear:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 2px; }

.gear, .tabs { -webkit-backdrop-filter: blur(8px) saturate(1.2); backdrop-filter: blur(8px) saturate(1.2); }
@media (max-width: 640px) { .toast { bottom: calc(108px + env(safe-area-inset-bottom, 0px)); } }   /* above the tab bar, with room to breathe */

.row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { width: 26px; height: 26px; flex-shrink: 0; border: 2px solid var(--check); border-radius: 7px; display: grid; place-items: center; transition: background .15s; }
.box svg { width: 16px; height: 16px; opacity: 0; color: var(--check-ink); }

.sleepin { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding-inline: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--muted); flex-shrink: 0; cursor: text; }

.sleepin input:focus { outline: none; }

/* progress */

.bars { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }

/* ---------- phones (iPhone and Android): app-style bottom tab bar ---------- */

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--band); gap: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    border-top: 1px solid color-mix(in srgb, var(--gold-soft) 40%, transparent); box-shadow: 0 -6px 20px rgba(0,0,0,.18); }

  body { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }

.cell { display: inline-grid; place-items: center; width: 44px; height: 44px; cursor: pointer; position: relative; }
.cell input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.cell input:checked + .box { background: var(--gold); border-color: var(--gold); }
.cell input:checked + .box svg { opacity: 1; color: #FFFFFF; }
.gitem { background-color: var(--surface); }
.gitem.flash { animation: flash .7s ease-out; }
.gitem.done .iic { background: color-mix(in srgb, var(--gold-soft) 14%, var(--surface)); color: var(--gold-ink); }
.gitem.done .txt > span:first-child { color: var(--gold-ink); font-weight: 600; }
.xrow td { padding: 0 0 4px; }
.xrow .entries { padding-inline-start: 62px; padding-block: 2px 8px; }
.sidecard { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.sidehead { display: flex; flex-direction: column; gap: 2px; }
.sidehead .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.sidehead .v { font-size: 34px; font-weight: 700; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.daybars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; }
.dbar { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.dbar .pv { font-variant-numeric: tabular-nums; min-height: 15px; }
.dbar .tr { display: flex; align-items: flex-end; width: 100%; height: 90px; background: var(--chip); border-radius: 6px; overflow: hidden; }
.dbar .fl { display: block; width: 100%; background: var(--check); border-radius: 6px; }
.dbar.sel .fl { background: var(--gold); }
.dbar.sel .dl { color: var(--ink); font-weight: 700; }
.dbar.fut { opacity: .45; }
.sidecard .cmp { padding: 0; gap: 8px; }
.sidecard .bl { grid-template-columns: 112px minmax(0, 1fr) 40px; }
.bl > span:first-child { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.dbar .dl { font-size: 13px; }
.sidecard .note { padding: 0; }
@media (min-width: 1024px) {
  .wrap { max-width: 1240px; }
  header .wrap.hd { max-width: none; padding-inline: max(32px, env(safe-area-inset-left, 0px)); }   /* on a wide screen the name sits at the right edge and the buttons at the left */
  .trackbody > .weekside { order: 0; }
  .trackbody { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .weekside { position: sticky; top: calc(var(--hdr-h, 0px) + 16px); padding-block: 10px; }
  .secs.split { flex-direction: row; align-items: flex-start; }
  .secs.split > .seccol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .days { max-width: 640px; margin-inline: auto; }
  #progress.stack, #logview.stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  #progress > .alert, #progress > .kpis, #logview > .card:first-child, #logview > .kpis, #logview > .empty, #progress > .empty { grid-column: 1 / -1; }
  #progress > .empty + .goals { grid-column: 1 / -1; }
  .pcols { grid-column: 1 / -1; display: flex; gap: 16px; align-items: flex-start; }
  .pcols > .pcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
}

@media (max-width: 640px) { .hlogo { width: 44px; height: 44px; } }
@media (max-width: 520px) { .hlogo { display: none; } }   /* on a phone the name needs the room */
header .wrap.hd { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; padding-block: 18px; flex-direction: initial; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.emblem { width: 46px; height: 46px; color: var(--gold-soft); flex-shrink: 0; }
.brandtxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brandtxt h1 { font-size: 22px; line-height: 1.3; letter-spacing: 0; }
/* on narrow screens the name breaks after the dash, never inside the second part */
.brandtxt h1 .nmrest { display: inline-block; }
@media (max-width: 370px) { header .brandtxt h1 .nmrest { display: inline; } }
.hijriline { margin: 0; font-size: 13.5px; color: var(--gold-soft); font-weight: 600; }
.todayline { margin: 0; font-size: 12.5px; color: rgba(246,243,234,.78); font-weight: 500; }
.corner { justify-self: end; display: flex; align-items: center; gap: 12px; }
@media (min-width: 641px) {
  .tabs { justify-self: center; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(212,178,106,.3); width: auto; }
  .tab { flex: initial; border: 0; border-radius: 999px; padding: 8px 18px; min-height: 42px; color: rgba(246,243,234,.8); }
  .tab[aria-selected="true"] { background: var(--gold-soft); color: var(--band); }
  .tab[aria-selected="true"] svg { color: var(--band); }
  .tab:hover:not([aria-selected="true"]) { background: rgba(255,255,255,.08); }
}
@media (min-width: 641px) and (max-width: 1023px) {
  header .wrap.hd { grid-template-columns: minmax(0, 1fr) auto; row-gap: 12px; }
  header .wrap.hd .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
  header .wrap.hd .tabs .tab { flex: 1 1 0; justify-content: center; }
}
@media (max-width: 640px) {
  header .wrap.hd { grid-template-columns: minmax(0, 1fr) auto; padding-block: 14px; }
  .emblem { width: 38px; height: 38px; }
  .brandtxt h1 { font-size: 19px; }
  .todayline { font-size: 12px; }
  .corner { gap: 8px; }
  .palette { gap: 6px; }
  .swatch { width: 26px; height: 26px; }
}
html[dir="ltr"] .weeknav .iconbtn svg { transform: scaleX(-1); }
.langseg { display: flex; gap: 8px; flex-wrap: wrap; }


/* ---------- settings ---------- */
#settingsview.stack { max-width: 760px; margin-inline: auto; gap: 14px; }
.grp { margin: 12px 4px -4px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }

.srow { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

/* ---------- app lock: the page blurs behind a keypad, and the blur melts away when the code is right ---------- */
.lockscreen { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow-y: auto;
  padding: max(24px, env(safe-area-inset-top, 0px)) 20px max(24px, env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--band) 80%, transparent);
  -webkit-backdrop-filter: blur(26px) saturate(1.3); backdrop-filter: blur(26px) saturate(1.3);
  transition: opacity .6s ease, -webkit-backdrop-filter .6s ease, backdrop-filter .6s ease; }
.lockscreen.entering, .lockscreen.leaving { opacity: 0; -webkit-backdrop-filter: blur(0px) saturate(1); backdrop-filter: blur(0px) saturate(1); }
.lockscreen.leaving { pointer-events: none; }
/* while locked, the page behind stays visible so the frosted glass shows through, but it is sealed off: it takes no tap, key or focus (inert + the capture-phase guard), it cannot scroll, and the blur leaves it unreadable */
html.is-locked, html.is-locked body { overflow: hidden !important; }
html.is-locked body > *:not(.lockscreen):not(script):not(style):not(link):not(title) { pointer-events: none !important; }
/* a browser too old to frost the page behind the glass hides it outright instead, so nothing shows through sharp */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html.is-locked body > *:not(.lockscreen):not(script):not(style):not(link):not(title) { visibility: hidden !important; }
}
.lockscreen .lpat { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .2; pointer-events: none; }
.lockcard { position: relative; width: min(330px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; color: #F6F3EA; text-align: center; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.lockscreen.entering .lockcard { transform: translateY(14px) scale(.97); }
.lockscreen.leaving .lockcard { transform: scale(1.05); }
.lockmark { width: 66px; height: 66px; display: grid; place-items: center; margin-bottom: 2px; }
.lockmark span { width: 46px; height: 46px; display: grid; place-items: center; border: 1.5px solid var(--gold-soft); border-radius: 11px; transform: rotate(45deg); background: rgba(212,178,106,.12); box-shadow: 0 0 0 7px rgba(212,178,106,.08); }
.lockmark svg { width: 22px; height: 22px; color: var(--gold-soft); transform: rotate(-45deg); }
.lockname { font-size: 27px; font-weight: 700; line-height: 1.2; }
.lockdate { font-size: 13px; color: rgba(246,243,234,.78); margin-top: -8px; }
.lockhint { min-height: 24px; font-size: 15px; font-weight: 600; color: rgba(246,243,234,.94); margin-top: 6px; }
.lockhint.warn { color: #F8CBC5; }
.lockdots { display: flex; gap: 22px; direction: ltr; margin: 2px 0 12px; }
.lockdots i { width: 13px; height: 13px; border: 1.6px solid var(--gold-soft); border-radius: 3px; transform: rotate(45deg); transition: background-color .15s, box-shadow .3s; }
.lockdots i.on { background: var(--gold-soft); }
.lockdots i.pop { animation: ldpop .3s cubic-bezier(.3,1.6,.5,1); }
.lockdots.err { animation: lshake .45s ease; }
.lockdots.err i { border-color: #F2A39A; background: #F2A39A; }
.lockdots.ok i { background: var(--gold-soft); box-shadow: 0 0 16px rgba(212,178,106,.95); }
.lockpad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px 24px; direction: ltr; }
.lockpad button { width: 74px; height: 74px; border-radius: 50%; border: 1px solid rgba(212,178,106,.4); background: rgba(255,255,255,.08); color: #F6F3EA; font: 500 28px/1 var(--font); display: grid; place-items: center; cursor: pointer; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background-color .15s, transform .1s, border-color .15s; }
.lockpad button:hover { background: rgba(255,255,255,.13); }
.lockpad button:active, .lockpad button.hit { background: rgba(212,178,106,.34); border-color: var(--gold-soft); transform: scale(.93); }
.lockcard:focus { outline: none; }
.lockpad button:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 3px; }
.lockpad button:disabled { opacity: .35; cursor: default; transform: none; }
.lockpad .lk-ghost { border-color: transparent; background: transparent; font-size: 15px; font-weight: 600; }
.lockpad .lk-ghost svg { width: 27px; height: 27px; }
.lockpad .lk-empty { visibility: hidden; }
.lockfoot { margin-top: 4px; background: none; border: 0; color: #F2DDA4; font: 600 14px var(--font); cursor: pointer; min-height: 44px; padding: 0 14px; }
.lockfoot:focus-visible { outline: 2px solid var(--gold-soft); border-radius: 8px; }
.lockcard.forgot .lockpad, .lockcard.forgot .lockdots, .lockcard.forgot .lockfoot, .lockcard.forgot .lockhint { display: none; }
.lockforgot { background: rgba(0,0,0,.24); border: 1px solid rgba(212,178,106,.38); border-radius: 16px; padding: 16px; font-size: 14px; line-height: 1.8; display: flex; flex-direction: column; gap: 12px; }
.lockforgot p { margin: 0; }
.lockforgot-row { display: flex; flex-direction: column; gap: 8px; }
.lockbtn-danger, .lockbtn-quiet { min-height: 46px; border-radius: 12px; font: 700 15px var(--font); cursor: pointer; padding: 0 14px; }
.lockbtn-danger { background: #B3261E; color: #FFFFFF; border: 0; }
.lockbtn-quiet { background: transparent; color: #F6F3EA; border: 1px solid rgba(246,243,234,.4); }
.lockbtn-danger:focus-visible, .lockbtn-quiet:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 2px; }
@keyframes ldpop { 0% { transform: rotate(45deg) scale(.5); } 60% { transform: rotate(45deg) scale(1.35); } 100% { transform: rotate(45deg) scale(1); } }
@keyframes lshake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@media (max-height: 680px) { .lockpad { grid-template-columns: repeat(3, 62px); gap: 10px 22px; } .lockpad button { width: 62px; height: 62px; font-size: 24px; } .lockcard { gap: 10px; } .lockmark { display: none; } }
@media (prefers-reduced-motion: reduce) { .lockscreen, .lockcard, .lockpad button { transition: none; } .lockdots i.pop, .lockdots.err { animation: none; } }
/* the lock button: beside Settings on wider screens, at the end of the bottom bar on phones */
.locktab { display: none; }
@media (max-width: 640px) { .gear.lockbtn { display: none; } .tab.locktab { display: flex; flex: 0 0 64px; } }

/* ---------- weekly goals (Progress) ---------- */

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@keyframes slideFromL { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 70% { transform: scale(.94); } 100% { transform: scale(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes flash { 0% { background-color: color-mix(in srgb, var(--gold-soft) 18%, var(--surface)); } 100% { background-color: var(--surface); } }
@keyframes gild { 0% { box-shadow: 0 0 0 1px var(--gold), 0 0 0 1px color-mix(in srgb, var(--gold-soft) 55%, transparent); } 100% { box-shadow: 0 0 0 1px var(--gold), 0 0 0 10px transparent; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fill { from { width: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes ptIn { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes chipIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 24px) scale(.9); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 16px) scale(.95); } }
@keyframes burst { 0% { opacity: 1; transform: translate(0, 0) scale(.4) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(160deg); } }

.view-in .stack > *, .view-in .pcol > *, .view-in .weekside > *, .view-in .weeknav, .view-in .days { animation: rise .28s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 35ms); }

/* ---------- Progress ---------- */
.psum { padding: 16px; display: flex; flex-direction: column; gap: 10px; border-width: 1px; }
.psum.warn { background: var(--warn-bg); border-color: var(--warn); } .psum.good { background: var(--good-bg); border-color: var(--good); } .psum.flat { background: var(--flat-bg); border-color: var(--flat); }
.psumh { display: flex; align-items: center; gap: 10px; } .psumh svg { width: 24px; height: 24px; flex: none; } .psumh h3 { margin: 0; font-size: 17px; }
.psum.warn .psumh { color: var(--warn); } .psum.good .psumh { color: var(--good); } .psum.flat .psumh { color: var(--flat); }
.psumt { margin: 0; font-size: 14.5px; line-height: 1.75; color: var(--ink); }
.pstep { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }

.ring:hover { background: color-mix(in srgb, var(--chip) 50%, transparent); }
.ring > svg { width: 84px; height: 84px; display: block; transform: rotate(-90deg); }
html[dir="rtl"] .ring > svg { transform: rotate(-90deg) scaleY(-1); }
.ring .rt { fill: none; stroke: var(--line); stroke-width: 8; }
.ring .rv { fill: none; stroke-width: 8; stroke-linecap: round; }

.ring .rd { font-size: 12px; font-weight: 600; } .ring .rd.up, .kpi .d.up { color: var(--good); } .ring .rd.down { color: var(--warn); } .ring .rd.same { color: var(--muted); }
.ymap { padding: 12px 12px 10px; --ys: 13px; }
.yscroll { overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }

.ymonths span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.yrow { display: flex; gap: 6px; width: max-content; }
.ydays { display: grid; grid-template-rows: repeat(7, var(--ys)); gap: 3px; font-size: 10px; color: var(--muted); width: 28px; flex: none; }

.ygrid { display: grid; grid-template-rows: repeat(7, var(--ys)); gap: 3px; }
.ygrid i, .ylegend i { width: var(--ys); height: var(--ys); border-radius: 3px; display: block; background: color-mix(in srgb, var(--line) 70%, transparent); }
.ygrid i.fut { background: transparent; }

.ygrid i.mid, .ylegend i.mid { background: color-mix(in srgb, var(--gold) calc(var(--a) * 100%), var(--surface)); }
.ygrid i.weak, .ylegend i.weak { background: color-mix(in srgb, var(--warn) calc(var(--a) * 100%), var(--surface)); }
.ylegend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.ylegend span { margin-inline: 4px; }
.pseg { margin: 12px 16px 0; }
.chart .avgband { fill: var(--check); opacity: .06; } .chart .avgline { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 5 5; } .chart .avgt { fill: var(--gold-ink); font-size: 16px; font-weight: 600; }
.chart .pt.good { stroke: var(--good); } .chart .pt.mid { stroke: var(--gold); } .chart .pt.weak { stroke: var(--warn); fill: var(--warn-bg); }

.alist { display: flex; flex-direction: column; }
.arow { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(60px, 34%) 42px 18px; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; text-align: start; cursor: pointer; min-height: 52px; }

.afl.good, .mbf.good, .wbf.good { background: var(--good); } .afl.mid, .mbf.mid, .wbf.mid { background: var(--gold); } .afl.weak, .mbf.weak, .wbf.weak { background: var(--warn); }

.arow .fchev { color: var(--muted); } .arow .fchev svg { width: 16px; height: 16px; display: block; transition: transform .2s; } .arow[aria-expanded="true"] .fchev svg { transform: rotate(180deg); }

.mb { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; cursor: pointer; }

.dstrip { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 3px; }

          snap.docs.forEach(function (d) { var data = d.data(); if (!data) return; if (data.kind === 'note') { store.collection('data/users/' + uid).doc(d.id).delete().catch(function () {}); } else if (data.kind === 'quran') { var qq = cleanQuran(data); if (demo) demo.quran = qq; else if (!quranTimer && !quranPending && qq.rev >= (quran.rev || 0)) quran = qq; } else if (data.kind === 'log' && data.id) { var cl = cleanLog(data.id, data); if (cl) nl[cl.id] = cl; } else if (data.kind === 'config' && data.config) { if (demo) demo.config = normConfig(data.config); else config = normConfig(data.config); } else if (data.weekStart && isWeekKey(String(data.weekStart))) (demo ? demo.weeks : weeks)[data.weekStart] = cleanWeek(data.checks); });
          if (demo) { demo.logs = nl; applyConfig(); return; }
          paintQuran();
          logs = nl; applyConfig();
          rerender();
        }, function () { setStatus('انقطع الاتصال، أعد فتح الصفحة'); });
      });
    }).catch(fallback);
  } else { fallback(); }
})();
