  var EN_EXACT = {"جداول Excel والاستعادة": "Excel tables and restore", "جداول Excel": "Excel tables", "سجلّي وتأشيري اليومي في جداول تُفتح في Excel.": "My log and daily ticks as tables that open in Excel.", "أنزّل سجلّي وتأشيري في جداول تُفتح في Excel، أو أستعيد نسخة احتياطية أخذتها من هنا أو من جهاز آخر أو من نسخة claude.ai، فتُدمج مع بياناتي دون أن تمسح شيئاً.": "I download my log and ticks as Excel tables, or restore a backup taken here, on another device or from the claude.ai version; it merges with my data without erasing anything.", "إعادة المحاور والبنود إلى الأصل": "Reset areas and items", "إعادة التصنيفات إلى الأصل": "Reset categories", "تجربة: خمسة أشهر مع أوراد": "Demo: five months with Awrad", "الالتزام في الشهر الأول": "Commitment in the first month", "وفي الشهر الأخير": "and in the last month", "بياناتي محفوظة كما هي، ولا يُحفظ شيء من التجربة.": "My data is kept as it was; nothing from the demo is saved.", "شاهد التقدّم": "See the progress", "إنهاء التجربة": "End the demo", "تجربة أوراد": "Try Awrad", "أنا في التجربة الآن: أتنقّل بين التأشير والتقدّم والسجلّ لأرى خمسة أشهر من الاستعمال. بياناتي محفوظة كما هي.": "I am in the demo now: I move between Today, Progress and Log to see five months of use. My data is kept as it was.", "أرى أوراد كاملاً كما لو استعمله شخص خمسة أشهر: تأشيره اليومي، ومحاسباته، وكتبه ووسائطه، وختمته للقرآن، وأهدافه الأسبوعية، وكيف يرتفع التزامه شهراً بعد شهر. بياناتي لا تُمسّ، ولا يُحفظ شيء من التجربة.": "I see Awrad in full, as if someone had used it for five months: daily ticks, reckonings, books and media, a Quran khatma, weekly goals, and how commitment rises month after month. My data is not touched, and nothing from the demo is saved.", "أعود إلى بياناتي كما تركتها.": "I go back to my data as I left it.", "خمسة أشهر في دقيقة": "Five months in a minute", "أبدأ من صفحة التقدّم، ثم أتنقّل كما أشاء.": "It opens on Progress; then I look around as I like.", "ابدأ التجربة": "Start the demo", "أنهي التجربة أولاً، ثم أستعيد نسختي.": "I end the demo first, then restore my backup.", "هذه بيانات التجربة؛ أنهي التجربة أولاً لأنزّل بياناتي.": "This is demo data; I end the demo first to download my data.", "حسابي في نسخة الموقع والتطبيق: إنشاء حساب بالبريد وكلمة المرور أو الدخول بـ Google أو Apple، من بطاقة «حسابي» في أعلى الإعدادات وحدها. بياناتي تُشفَّر على جهازي قبل أن تُرفع، وكلمة المرور لا تصل إلى الخادم، ورمز استعادة يعيد بياناتي إن نسيتها. وتغيير كلمة المرور، والخروج من جهاز أو من كل الأجهزة، وحذف الحساب نهائياً.": "My account in the website and app: create an account with email and password, or sign in with Google or Apple, from “My account” at the top of Settings only. My data is encrypted on my device before it is uploaded, my password never reaches the server, and a recovery code brings my data back if I forget it. Also: change the password, sign out of one device or all of them, and delete the account for good.", "مراجعة أمان وتشغيل: تُفحص قيود السجلّ وعدّاد القرآن عند فتح التطبيق كما تُفحص النسخة الاحتياطية، وحين يردّ Google Drive بأنه مشغول ينتظر التطبيق ويعيد المحاولة وحده بفواصل متزايدة دون أن يضيع شيء، وفحص آلي يثبت أن لا مفاتيح سرّية في ملفات التطبيق. و«تقرير الأخطاء» في الإعدادات: أنسخ تقرير ما ظهر من أخطاء وأرسله بنفسي، دون شيء من بياناتي، ولا يُرسل وحده إلى أي مكان.": "Security and operations review: log entries and the Quran counter are checked when the app opens, as backups are; when Google Drive says it is busy the app waits and tries again by itself at growing intervals without losing anything; and an automatic scan shows there are no secret keys in the app's files. Plus “Error report” in Settings: I copy a report of any errors and send it myself, with nothing of my data, and it is never sent anywhere by itself.", "تقرير الأخطاء": "Error report", "إن ظهر لي خطأ أنسخ تقريره وأرسله بنفسي لمن يساعدني. فيه رقم الإصدار والمتصفح ورسائل الأخطاء فقط، لا شيء من بياناتي، ولا يُرسل وحده إلى أي مكان.": "If something goes wrong, I copy the report and send it myself to whoever helps me. It holds only the version, the browser and the error messages, nothing of my data, and it is never sent anywhere by itself.", "لا أخطاء مسجّلة.": "No errors recorded.", "نسخ تقرير الأخطاء": "Copy error report", "مسح الأخطاء": "Clear errors", "مُسحت الأخطاء.": "Errors cleared.", "نُسخ التقرير، ألصقه في رسالة لمن يساعدني.": "Report copied; I paste it in a message to whoever helps me.", "لم يسمح المتصفح بالنسخ، أحدّد النص وأنسخه بنفسي.": "The browser didn't allow copying; I select the text and copy it myself.", "إصلاح «أهدافي الأسبوعية»: الهدف الأسبوعي يُحكم على أسبوعه كله، فلا يُحسب عليّ نقص ما دام بلوغ الهدف ممكناً في ما بقي من الأسبوع، والأسبوع الذي بلغت فيه هدفي لا يظهر ناقصاً إن بدأ شهر في وسطه. ورسالة «أتممت البرنامج» لا تتكرّر حين أؤشّر بنداً بهدف أسبوعي أو صلاة الليل بعد إتمام اليوم، ورسالة جديدة حين أبلغ هدفي الأسبوعي. وبطاقة الأهداف تظهر قبل أول تأشير، والضغط على + و− لا يعيد رسم الصفحة ولا يُضيّع مكاني، والبند والعدد المختاران لهدف جديد يبقيان.": "Weekly goals fixed: a weekly goal is judged on its whole week, so nothing counts against me while the goal can still be reached in the days left, and a week where I met my goal no longer looks short when a month starts in the middle of it. “I completed the programme” no longer repeats when I tick a weekly-goal item or the night prayer after finishing the day, and a new message tells me when I reach a weekly goal. The goals card shows before the first tick, pressing + and − no longer redraws the page or loses my place, and the item and number chosen for a new goal stay put.", "تجربة أوسع لخمسة أشهر: إخفاء عدة بنود ومحاور وإظهارها، وإضافة ستة محاور وبنود كثيرة وحذفها، دون أن تتغيّر نسب الأسابيع الماضية. وفي الشكل: بطاقات «التقدّم» و«السجلّ» في عمودين متوازنين على اللابتوب، وأسماء الأشهر الطويلة على سطرين في الرسم، وساعة النوم تنزل تحت اسم البند حين يضيق المكان، وأسماء المحاور الطويلة لا تتجاوز سطرين، ولا يُذكر «أكثر ما أتابعه» قبل أن أحدّد مجالاً لأي مدخل.": "A wider five-month test: hiding and showing several items and areas, adding six areas and many items and deleting them, without past weeks changing. In the layout: Progress and Log cards in two level columns on laptops, long month names on two lines in the chart, the bedtime field moving under the item name when space is tight, long area names kept to two lines, and no “most followed” before any entry has a subject.", "لم أحدّد مجالاً لأي مدخل في هذه الفترة بعد.": "I haven't given a subject to any entry in this period yet.", "مراجعة شاملة بتجربة خمسة أشهر من الاستخدام: تغيير البرنامج (إخفاء بند أو محور أو حذفه أو إضافته) لا يغيّر نسب الأسابيع الماضية، ولا تضيع علامة مهما أسرعت في التأشير، والصفحة المفتوحة تنتقل إلى اليوم الجديد بعد منتصف الليل، والأيام القادمة لا تُؤشَّر. وإصلاح عدّاد الختمة عند الصفحة 604، وفحص النسخة الاحتياطية قبل استعادتها، وملف الجدول (CSV) لا يبدأ خانةً بصيغة، وقيم الرسوم البيانية تظهر عند الوقوف عليها، ورسالة واضحة إن تعذّر الحفظ على الجهاز.": "A full review with five months of simulated use: changing the programme (hiding, deleting or adding an item or area) no longer changes past weeks, no tick is lost however fast I tick, a page left open moves to the new day after midnight, and days still to come cannot be ticked. Also: the khatma counter is fixed at page 604, a backup is checked before it is restored, the spreadsheet (CSV) file never starts a cell with a formula, chart values show on hover, and a clear message appears if saving on the device fails.", "إصلاح «التزامي هذا الأسبوع»: كل أيام الأسبوع تُحسب، لا الأيام التي أشّرت فيها فقط. وأهداف أسبوعية للبنود من «التقدّم»، مثل الرياضة 3 مرات في الأسبوع، تبدأ من أسبوعها ولا تغيّر ما سبق.": "Fix for “My commitment this week”: every day of the week counts, not only the days I ticked. And weekly goals for items in Progress, such as exercise 3 times a week; a goal starts in its week and never changes what came before.", "أهدافي الأسبوعية": "My weekly goals", "أحدّد كم مرة في الأسبوع أريد بنداً ما، فتُحسب نسبته على هذا الهدف لا على أيام الأسبوع كلها، ولا يُحسب عليّ نقص ما دام بلوغ الهدف ممكناً في ما بقي من الأسبوع. يبدأ الهدف من هذا الأسبوع ولا يغيّر نسب الأسابيع الماضية.": "I set how many times a week I want an item, and its percentage is counted against that goal, not against every day of the week; nothing counts against me while the goal can still be reached in the days left. A goal starts this week and never changes past weeks' percentages.", "لم أحدّد هدفاً بعد، فكل البنود تُحسب يومياً.": "No goals yet, so every item counts daily.", "مرة في الأسبوع": "Once a week", "مرتان في الأسبوع": "Twice a week", "3 مرات في الأسبوع": "3 times a week", "4 مرات في الأسبوع": "4 times a week", "5 مرات في الأسبوع": "5 times a week", "6 مرات في الأسبوع": "6 times a week", "أقلّ": "Fewer", "أكثر": "More", "حذف الهدف": "Remove goal", "إضافة الهدف": "Add goal", "البند": "Item", "في الفارسية: التاريخ الهجري الشمسي بدل الميلادي في كل الصفحة، والأرقام الفارسية.": "In Persian: the Solar Hijri calendar instead of the Gregorian across the page, and Persian digits.", "إضافة اللغة الفارسية: كل نصوص الصفحة بالفارسية، والتاريخ بأسماء الأشهر الفارسية.": "Persian added: every text on the page in Persian, with dates in Persian month names.", "فارسی": "فارسی", "القفل برمز سرّي: رمز من أربعة أرقام يُطلب عند فتح التطبيق، وكل ما خلفه ضبابي حتى يُفتح. أغيّره أو أوقفه من الإعدادات، وأقفل يدوياً من زرّ القفل، وأختار القفل التلقائي فور مغادرتي أو بعد مدة.": "Lock with a code: a four-digit code asked when the app opens, with everything behind it blurred until it opens. I change or turn it off in Settings, lock by hand with the lock button, and choose auto-lock the moment I leave or after a while.", "القفل برمز سرّي": "Lock with a code", "التطبيق مقفل برمز من أربعة أرقام يُطلب حين أفتحه، فلا يطّلع أحد على محاسبتي وسجلّي إن أمسك هاتفي.": "The app is locked with a four-digit code asked when I open it, so nobody sees my reckoning and log if they hold my phone.", "رمز من أربعة أرقام يُطلب حين أفتح التطبيق، فلا يطّلع أحد على محاسبتي وسجلّي إن أمسك هاتفي. الرمز يبقى على هذا الجهاز وحده.": "A four-digit code asked when I open the app, so nobody sees my reckoning and log if they hold my phone. The code stays on this device only.", "تفعيل القفل": "Turn on the lock", "أختار رمزاً ثم أكتبه مرة ثانية للتأكيد.": "I choose a code, then type it again to confirm.", "الرمز": "Code", "أغيّره متى شئت، أو أوقف القفل. في الحالتين أكتب الرمز الحالي أولاً.": "I change it whenever I like, or turn the lock off. Either way I type the current code first.", "تغيير الرمز": "Change code", "إيقاف القفل": "Turn off the lock", "القفل التلقائي": "Auto-lock", "يُقفل التطبيق حين أغادره، أو بعد مدة لا أستعمله فيها. ويُطلب الرمز دائماً حين أفتحه من جديد.": "The app locks when I leave it, or after a while without use. The code is always asked when I open it again.", "فور مغادرتي": "When I leave", "بعد دقيقة": "After 1 min", "بعد 5 دقائق": "After 5 min", "بعد 10 دقائق": "After 10 min", "بعد 30 دقيقة": "After 30 min", "قفل الآن": "Lock now", "أو من زرّ القفل بجانب الإعدادات، وفي الهاتف من الشريط السفلي.": "Or with the lock button beside Settings, and on phones from the bottom bar.", "قفل التطبيق": "Lock the app", "قفل": "Lock", "اسم المشروع: «أوراد - البرنامج الشخصي اليومي»، وبالإنجليزية Awrad.": "Project name: Awrad.", "زرّ الاستعادة صار يفتح الملفات بطريقة تعمل في متصفحات أكثر، ويقبل ملف النسخة مهما كان نوعه المسجّل على الهاتف.": "The restore button now opens files in a way that works in more browsers, and accepts the backup file whatever type the phone gives it.", "أختار ملف نسخة احتياطية فيُدمج مع بياناتي الحالية دون أن يمسح شيئاً. وبياناتي في حسابي، فما أستعيده على أي جهاز يظهر على أجهزتي كلها.": "I pick a backup file; it merges with my current data without erasing anything. My data is in my account, so what I restore on any device shows on all of them.", "كل تأشير يُحفظ فوراً حتى لو أغلقت النافذة مباشرة بعده.": "Every tick is saved at once, even if I close the window right after.", "بياناتي محفوظة على جهازي هذا وحده، داخل هذا التطبيق، لا تُرسل إلى أي مكان ولا يراها أحد، وتبقى كما هي حين يتحدّث التطبيق. لكنها لا تنتقل وحدها إلى أجهزتي الأخرى، وتضيع إن حذفت التطبيق أو مسحت بيانات المتصفح؛ لذلك أنزّل نسخة احتياطية بين حين وآخر، أستعيدها هنا أو على جهاز آخر، أو أفتحها في Excel.": "My data is saved on this device alone, inside this app. It is never sent anywhere and nobody else sees it, and it stays as it is when the app updates. But it does not move to my other devices by itself, and it is lost if I delete the app or clear the browser data, so I download a backup now and then to restore here or on another device, or to open in Excel.", "حين يكون جهازي متصلاً بالإنترنت يفتح التطبيق آخر إصدار تلقائياً، ودون إنترنت يفتح آخر إصدار حفظه. بياناتي وإعداداتي تبقى كما هي.": "When my device is online the app opens the latest version by itself; offline it opens the last version it saved. My data and settings stay as they are.", "تحديث التطبيق": "Update the app", "أعيد تحميل التطبيق لأحصل على آخر إصدار إن كنت متصلاً بالإنترنت.": "I reload the app to get the latest version when I am online.", "إصلاح: المحاور المضافة لم تعد تلامس «محاسبة اليوم» في عرض اللابتوب، ورسالة نجاح الاستعادة صارت تبقى ظاهرة.": "Fix: added areas no longer touch “Today's reckoning” on laptops, and the restore success message now stays visible.", "الأعمال اليومية صارت فوق «التزامي هذا الأسبوع».": "Daily devotions now sit above “My commitment this week”.", "مراجعة شاملة للهاتف واللابتوب والجهاز اللوحي في اللغتين والألوان والوضعين: ما أكتبه بنفسي لا يُترجم، واختيارات أوضح في الوضع الليلي، وتسميات أعرض، وترتيب أفضل للشاشات الصغيرة والمتوسطة.": "A full review on phone, laptop and tablet in both languages, all colours and both themes: what I write myself is never translated, clearer selections in dark mode, wider labels, and better layout on small and medium screens.", "أعمال هذا اليوم على حبّ": "Today's devotions, for the love of", "عبارة «أعمال هذا اليوم على حبّ…» في الأعمال اليومية.": "The line “Today's devotions, for the love of…” in daily devotions.", "الإما next to “Regular sleep” in “Today”.", "المتوسط": "Average", "أبكر ليلة": "Earliest night", "أكثرها تأخراً": "Latest night", "كل ساعات نومي": "All my bedtimes", "ساعة نومي في التقدّم (متوسط الأسبوع ورسم آخر 14 يوماً) وفي السجلّ، والتجربة تشمل ساعات النوم والقرآن والختمة.": "My bedtime in Progress (weekly average and a 14-day chart) and in the Log; the demo now includes bedtimes, the Quran and the khatma.", "ساعة الخلود إلى النوم (اختياري)": "Bedtime (optional)", "ساعة الخلود إلى النوم بنظام 24 ساعة (اختياري)": "Bedtime, 24-hour (optional)", "أكتب الساعة بين 00:00 و23:59": "Enter a time between 00:00 and 23:59", "ساعة النوم": "Bedtime", "خانة اختيارية بجانب «تنظيم عملية النوم» لساعة الخلود إلى النوم بنظام 24 ساعة، وتظهر في ملف التأشير اليومي.": "An optional field next to “Regular sleep” for bedtime in 24-hour time, included in the daily ticks file.", "النسب في «التزامي هذا الأسبوع» تتحدّث فور التأشير على الهاتف أيضاً.": "Percentages in “My commitment this week” update the moment I tick, on phones too.", "«لَركعتان يصلّيهما العبد في جوف الليل خيرٌ من الدنيا وما فيها»": "“Two rak‘ahs a servant prays in the depth of the night are better than the world and all it holds.”", "صلاة الليل نافلة: أؤشّر عليها كما أشاء، ولا تدخل في أي نسبة ولا في إتمام المحور أو اليوم.": "Night prayer is voluntary: I can tick it, but it is not counted in any percentage or in completing the area or the day.", "إصلاح عدّاد القرآن: أول ضغطة + تُحسب دائماً، وتأشير التلاوة يبقى ما دمت تقدّمت اليوم صفحة على الأقل عمّا انتهيت إليه بالأمس، ويُزال حين أعود إليه.": "Quran counter fixed: the first + always counts, and the recitation tick stays as long as I am at least one page past where I ended yesterday, and is removed when I go back to it.", "حين تعود صفحات القرآن لليوم إلى صفر بزر −، يُزال تأشير التلاوة لليوم دائماً.": "When today's Quran pages go back to zero with −, today's recitation tick is always removed.", "إزالة تحريك البطاقات وتثبيتها؛ البطاقات بترتيبها الأصلي.": "Moving and pinning cards removed; cards keep their original order.", "مراجعة الاتجاه في اللغتين: الأرقام والرسوم والأشرطة من اليمين في العربية ومن اليسار في الإنجليزية. وإصلاح: زر − في القرآن يزيل تأشير التلاوة الذي أضافه زر +.": "Direction reviewed in both languages: numbers, charts and bars run from the right in Arabic and from the left in English. Fix: the Quran − button removes the recitation tick that + added.", "التاريخ الهجري فوق الميلادي في الترويسة، ومحاسبة اليوم مساحةً للتفريغ، ومتابعة الختمة.": "Hijri date above the Gregorian in the header, a daily reckoning space, and khatma tracking.", "بطاقة القرآن الكريم بزرّي + و− للصفحة التي وصلت إليها مع السورة والجزء والحزب، وطيّ «التزامي هذا الأسبوع»، وزر «انتهيت» في محاسبة اليوم دون أي حفظ.": "A Holy Quran card with + and − for the page I reached, with surah, juz' and hizb; “My commitment this week” folds; a “Done” button in the daily reckoning, with nothing saved.", "القرآن الكريم": "The Holy Quran", "سورة": "Surah", "الجزء": "Juz'", "الحزب": "Hizb", "رجوع صفحة": "Back one page", "صفحة قرأتها": "A page I read", "أضغط + مع كل صفحة أقرؤها، فأعرف أين وصلت.": "I press + for every page I read, so I know where I have reached.", "الحمد لله، ختمت القرآن الكريم": "Alhamdulillah, I completed the Holy Quran", "مساحة أفرّغ فيها ما في نفسي من تقصير أو إنجاز. لا يُحفظ شيء مما أكتبه، وحين أضغط «انتهيت» يُمحى كله.": "A space to let out what is on my mind, shortcomings or achievements. Nothing I write is saved, and when I press “Done” it is all erased.", "انتهيت": "Done", "أفرغت ما في نفسي، ولم يُحفظ منه شيء.": "I let it all out, and none of it was saved.", "صفحات": "pages", "الحالي": "Current", "محاسبة اليوم": "Today's reckoning", "مساحة أفرّغ فيها ما في نفسي من تقصير أو إنجاز. يُحفظ ما أكتبه تلقائياً ولا يُعرض مرة أخرى، ولا يظهر إلا ضمن النسخة الاحتياطية حين أنزّلها.": "A space to let out what is on my mind, shortcomings or achievements. What I write saves automatically and is never shown again; it appears only in the backup when I download it.", "أكتب ما في نفسي…": "I write what is on my mind…", "حُفظ ما كتبته، ولن يُعرض مرة أخرى.": "What I wrote is saved and won't be shown again.", "ختمتي": "My khatma", "أسجّل صفحات التلاوة بزر + بجانب بند القرآن، فتظهر ختمتي هنا.": "I log recitation pages with + next to the Quran item, and my khatma appears here.", "الختمة الأولى": "First khatma", "المظهر": "Appearance", "في «تلقائي» يتبع إعداد جهازي.": "In “Auto” it follows my device setting.", "تلقائي": "Auto", "نهاري": "Light", "ليلي": "Dark", "اختيار المظهر في الإعدادات: تلقائي أو نهاري أو ليلي.": "Appearance choice in Settings: auto, light or dark.", "عام": "General", "بياناتي": "My data", "برنامجي": "My programme", "لغة الصفحة": "Page language", "تُحفظ على هذا الجهاز": "Saved on this device", "ابدأ التجربة": "Start demo", "تنزيل": "Download", "ملف كامل أستعيده لاحقاً، أو جداول تُفتح في Excel.": "A full file I can restore later, or tables that open in Excel.", "استعادة": "Restore", "أختار ملف نسخة احتياطية فيُدمج مع بياناتي الحالية دون أن يمسح شيئاً.": "I pick a backup file; it merges with my current data without erasing anything.", "استعادة من نسخة احتياطية": "Restore from a backup", "المحاور والبنود": "Areas and items", "محور أضفته": "My area", "بند أضفته": "My item", "إضافة بند": "Add an item", "الإصدار الحالي": "Current version", "نسخة من الصفحة": "A copy of the page", "سجلّ التغييرات": "Change history", "إعدادات أرتب: أقسام واضحة، ومفاتيح إظهار، وأزرار موحّدة، وسجلّ التغييرات مطويّ. وإزالة الشعار من الترويسة.": "Tidier settings: clear groups, show switches, consistent buttons and a folded change history. The emblem is removed from the header.", "ترويسة جديدة: التبويبات في الوسط، والألوان والإعدادات على الطرف، وتاريخ اليوم تحت العنوان. وخيار اللغة الإنجليزية في الإعدادات.": "New header: tabs in the centre, colours and settings at the edge, and today's date under the title. English language option in Settings.", "زر لتجربة الصفحة بنتائج عشوائية لشهرين دون حفظ، وشريط الأيام في الوسط على اللابتوب.": "A button to try the page with two months of random results without saving, and the day strip centred on laptops.", "نسخة اللابتوب: برنامج اليوم على عمودين، وملخّص جانبي لالتزامي يوماً بيوم، والتقدّم والسجلّ والإعدادات على عمودين.": "Laptop version: today's programme in two columns, a side summary of my commitment day by day, and Progress, Log and Settings in two columns.", "الإصدار الأول: التأشير اليومي أسبوعاً بأسبوع بدءاً من الاثنين، والتقدّم برسوم الأسابيع والأشهر ومقارنة المحاور وتنبيه عند تراجع الالتزام، والسجلّ للكتب والوسائط والقرآن والتواصل والرياضة مع التصنيف والتاريخ، والإعدادات لإضافة المحاور والبنود وإخفائها وتعديل التصنيفات، والنسخ الاحتياطية وتنزيل CSV والاستعادة، وثلاثة ألوان، وأيقونات، وحركات، والذهبي لكل ما أُنجز، وتصميم للهاتف.": "First release: daily ticking week by week from Monday; progress with weekly and monthly charts, area comparison and an alert when commitment slips; a log for books, media, Quran, contact and sport with categories and dates; settings to add and hide areas and items and edit categories; backups, CSV export and restore; three colours, icons, motion, gold for everything done, and a phone layout.", "التأشير": "Today", "التقدّم": "Progress", "السجلّ": "Log", "الإعدادات": "Settings", "أوراد - البرنامج الشخصي اليومي": "Awrad", "لون صفحتي": "Page colour", "أخضر": "Green", "كحلي": "Navy", "عنّابي": "Burgundy", "الأسبوع السابق": "Previous week", "الأسبوع التالي": "Next week", "العودة إلى هذا الأسبوع": "Back to this week", "أيام الأسبوع": "Days of the week", "ملخّص الأسبوع": "Week summary", "الاثنين": "Monday", "الثلاثاء": "Tuesday", "الأربعاء": "Wednesday", "الخميس": "Thursday", "الجمعة": "Friday", "السبت": "Saturday", "الأحد": "Sunday", "ن": "M", "ث": "T", "ر": "W", "خ": "T", "ج": "F", "س": "S", "ح": "S", "الصلوات الخمس": "The five prayers", "الاجتماعيات": "Social", "المتابعات والمطالعات": "Following and reading", "الصحة الجسدية": "Physical health", "صلاة الصبح": "Fajr prayer", "التعقيبات ودعاء العهد": "Post-prayer supplications and Du'a al-Ahd", "صلاتا
